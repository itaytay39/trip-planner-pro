<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מנהל המשימות</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, body { font-family: 'Heebo', 'Arial Hebrew', sans-serif; }

    body {
      background: #f0f2f9;
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(99,102,241,.07) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(139,92,246,.05) 0%, transparent 50%);
      min-height: 100vh;
    }

    /* ── Animations ── */
    @keyframes slideIn  { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    @keyframes popIn    { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
    @keyframes confetti { 0%{top:-20px;opacity:1} 85%{opacity:1} 100%{top:108vh;opacity:0;transform:rotate(540deg)} }

    .card-enter   { animation: slideIn .2s cubic-bezier(.34,1.4,.64,1); }
    .pop-in       { animation: popIn   .25s cubic-bezier(.34,1.4,.64,1); }
    .fade-up      { animation: fadeUp  .22s ease; }
    .confetti-piece { position:fixed;pointer-events:none;z-index:9999;animation:confetti linear forwards; }

    /* ── Task card ── */
    .task-card {
      background: #ffffff;
      border: 1.5px solid #e8ecf4;
      border-right: 4px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05), 0 2px 12px rgba(0,0,0,.04);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      cursor: grab;
      user-select: none;
    }
    .task-card:hover:not(.dragging):not(.pressing) {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
      border-color: #d0d7e8;
    }
    .task-card.c-urgent { border-right-color: #f87171; background: #fffafa; }
    .task-card.c-medium { border-right-color: #fb923c; background: #fffcfa; }
    .task-card.c-low    { border-right-color: #a3e635; }
    .task-card.c-today  { border-right-color: #818cf8; }
    .task-card.done-card{ border-right-color: #e2e8f0; background:#fafbfc; }
    .task-card.dragging { opacity:.4; transform:scale(.98) rotate(.5deg); }
    .task-card.pressing { transform:scale(.97); }

    /* ── Header ── */
    .app-header {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1.5px solid #e8ecf4;
      box-shadow: 0 1px 8px rgba(0,0,0,.05);
    }

    /* ── Today section ── */
    .today-wrap {
      background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
      border: 1.5px solid #fde68a;
      border-radius: 18px;
      overflow: hidden;
    }
    .today-head {
      background: linear-gradient(90deg, #fde68a 0%, #fcd34d 100%);
      border-bottom: 1px solid #fbbf24;
    }

    /* ── Primary button ── */
    .btn-primary {
      background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(99,102,241,.3);
      transition: all .17s ease;
      border: none;
      cursor: pointer;
    }
    .btn-primary:hover  { background: linear-gradient(135deg,#818cf8,#8b5cf6); transform:translateY(-1px); box-shadow:0 4px 14px rgba(99,102,241,.4); }
    .btn-primary:active { transform:scale(.97); }

    /* ── Ghost button ── */
    .btn-ghost {
      background: white;
      color: #64748b;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-weight: 600;
      transition: all .15s ease;
      cursor: pointer;
    }
    .btn-ghost:hover  { background:#f8fafc; border-color:#c7d2fe; color:#6366f1; }
    .btn-ghost.active { background:#eef2ff; border-color:#c7d2fe; color:#6366f1; }

    /* ── Inputs ── */
    .inp {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      color: #1e293b;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .inp::placeholder { color: #94a3b8; }
    .inp:focus {
      background: #fff;
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99,102,241,.12);
      outline: none;
    }
    select.inp { color:#475569; appearance:none; }
    select.inp option { background:#fff; color:#1e293b; }

    /* ── Urgency buttons ── */
    .ub { border-radius:12px; border:2px solid; font-weight:700; font-size:13px; transition:all .14s ease; padding:9px 0; cursor:pointer; }
    .ub-u      { border-color:#fca5a5; background:#fff5f5; color:#ef4444; }
    .ub-u.on   { background:#ef4444;  border-color:#ef4444; color:#fff; }
    .ub-m      { border-color:#fdba74; background:#fff8f0; color:#f97316; }
    .ub-m.on   { background:#f97316;  border-color:#f97316; color:#fff; }
    .ub-l      { border-color:#86efac; background:#f0fdf4; color:#16a34a; }
    .ub-l.on   { background:#16a34a;  border-color:#16a34a; color:#fff; }

    /* ── Duration buttons ── */
    .db { border-radius:12px; border:2px solid #e2e8f0; font-weight:600; font-size:12px; transition:all .14s ease; padding:8px 0; cursor:pointer; color:#94a3b8; background:#f8fafc; }
    .db.on { border-color:#818cf8; background:#eef2ff; color:#6366f1; }

    /* ── Badges ── */
    .bdg { border-radius:20px; font-size:11px; font-weight:700; padding:3px 9px; display:inline-flex; align-items:center; gap:3px; }
    .bu  { background:#fee2e2; color:#dc2626; }
    .bm  { background:#ffedd5; color:#ea580c; }
    .bl  { background:#f1f5f9; color:#64748b; }
    .bp  { background:#ede9fe; color:#7c3aed; }
    .blg { background:#f3e8ff; color:#9333ea; }
    .bsh { background:#ccfbf1; color:#0d9488; }
    .bty { background:#e0e7ff; color:#4338ca; }

    /* ── Checkbox ── */
    .chk {
      width:22px; height:22px; border-radius:50%; border:2px solid;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; cursor:pointer; transition:all .16s ease;
    }
    .chk-u { border-color:#fca5a5; background:#fff5f5; }
    .chk-u:hover { background:#fee2e2; border-color:#f87171; }
    .chk-m { border-color:#fdba74; background:#fff8f0; }
    .chk-m:hover { background:#ffedd5; border-color:#fb923c; }
    .chk-l { border-color:#86efac; background:#f0fdf4; }
    .chk-l:hover { background:#dcfce7; border-color:#4ade80; }
    .chk-done { border-color:#6366f1 !important; background:#6366f1 !important; }

    /* ── Calendar tip ── */
    .cal-tip {
      background:#eff6ff; border:1px solid #bfdbfe;
      border-radius:10px; padding:8px 12px; margin-top:8px;
      display:flex; align-items:center; gap:8px;
    }

    /* ── Modal ── */
    .modal-bg  { background:rgba(15,23,42,.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
    .modal-box { background:#fff; border:1.5px solid #e8ecf4; border-radius:24px; box-shadow:0 24px 60px rgba(0,0,0,.18); }

    /* ── Toast ── */
    .toast { background:#1e293b; color:#e2e8f0; border-radius:14px; box-shadow:0 8px 28px rgba(0,0,0,.2); }
    .toast-celebrate { background:linear-gradient(135deg,#4338ca,#7c3aed); color:#e0e7ff; }

    /* ── Kanban ── */
    .kan-col   { background:#fff; border:1.5px solid #e8ecf4; border-radius:18px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.04); }
    .kan-drop  { border-color:#818cf8 !important; background:#f5f3ff !important; }
    .kan-card  { background:#f8fafc; border:1.5px solid #e8ecf4; border-radius:12px; transition:all .14s ease; cursor:grab; }
    .kan-card:hover { background:#fff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.08); }

    /* ── Section title ── */
    .sec-t { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:#94a3b8; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
    .dot   { width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0; }

    /* ── Saved ── */
    .saved-pill {
      position:fixed; bottom:22px; right:14px; z-index:30;
      background:white; border:1.5px solid #e2e8f0;
      color:#94a3b8; font-size:11px; font-weight:700;
      padding:5px 11px; border-radius:20px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
      pointer-events:none;
    }

    /* ── FAB ── */
    .fab {
      position:fixed; bottom:22px; left:18px; z-index:25;
      width:54px; height:54px; border-radius:50%;
      background:linear-gradient(135deg,#6366f1,#7c3aed);
      color:#fff; font-size:26px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 18px rgba(99,102,241,.45);
      transition:all .17s ease; border:none; cursor:pointer;
    }
    .fab:hover { transform:scale(1.08); box-shadow:0 6px 24px rgba(99,102,241,.55); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#e2e8f0; border-radius:2px; }

    .lc2 { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── Constants ── */
const PROJECTS = [
  'כללי','הנהלה','עובדים','לקוחות','כספים','שיווק',
  'גיוס עובדים','פיתוח עסקי','הדרכות',
  'פרויקטים בביצוע','משימות אישיות','בית ומשפחה','תכנון אסטרטגי'
];
const KANBAN_COLS = {
  todo:       { label:'לביצוע', icon:'📋', hdr:'bg-slate-100 text-slate-600'   },
  inprogress: { label:'בתהליך', icon:'⚡', hdr:'bg-indigo-50 text-indigo-600' },
  done:       { label:'הושלם',  icon:'✅', hdr:'bg-emerald-50 text-emerald-600'},
};
const MILESTONES = [5,10,20,50];
const CHEERS = ['מעולה! אתה מתקדם בקצב מצוין 🚀','יום פרודוקטיבי במיוחד! 👏','אתה מנהל את הזמן כמו מקצוען ⭐','כל הכבוד! המשך כך 🏆'];
const STORAGE = 'tm_v5';

/* ── Helpers ── */
let _n=0;
const uid = ()=>`${Date.now()}-${++_n}`;
const today = ()=>new Date().toISOString().slice(0,10);

function inferUrgency(t,d='') {
  const s=(t+' '+d).toLowerCase();
  if(['דחוף','היום','לקוח','מכרז','asap','מיד','עכשיו'].some(k=>s.includes(k))) return 'urgent';
  if(['השבוע','בקרוב','חשוב','מחר'].some(k=>s.includes(k))) return 'medium';
  return 'low';
}
function inferDur(t,d='') {
  const s=(t+' '+d).toLowerCase();
  if(['פגישה','הדרכה','כנס','ישיבה','סדנה','עבודה על','meeting'].some(k=>s.includes(k))) return 'long';
  if(['שלח','אשר','בדוק','עדכן','quick','call'].some(k=>s.includes(k))) return 'short';
  return null;
}
function load() {
  try {
    const r=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(!r) return null;
    if(r.streak?.lastDate&&r.streak.lastDate!==today()){
      const yd=new Date(); yd.setDate(yd.getDate()-1);
      r.streak.count = r.streak.lastDate===yd.toISOString().slice(0,10)?r.streak.count:0;
      r.streak.lastDate=today();
    }
    return r;
  } catch { return null; }
}

/* ── Confetti ── */
function Confetti({onDone}) {
  const ps=useMemo(()=>Array.from({length:45},(_,i)=>({
    id:i,left:Math.random()*100,
    dur:1.4+Math.random()*1.8,delay:Math.random()*.9,
    g:['🎉','⭐','✨','🎊','💜','🌟'][Math.floor(Math.random()*6)],
    sz:14+Math.random()*18,
  })),[]);
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);
  return (
    <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999}}>
      {ps.map(p=>(
        <span key={p.id} className="confetti-piece"
          style={{left:`${p.left}%`,fontSize:`${p.sz}px`,
                  animationDuration:`${p.dur}s`,animationDelay:`${p.delay}s`}}>
          {p.g}
        </span>
      ))}
    </div>
  );
}

/* ── Toast ── */
function Toast({msg,type,onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3200);return()=>clearTimeout(t);},[]);
  return (
    <div className={`toast fade-up ${type==='celebrate'?'toast-celebrate':''}`}
      style={{position:'fixed',bottom:28,left:'50%',transform:'translateX(-50%)',
              zIndex:50,padding:'12px 22px',fontSize:13,fontWeight:700,
              textAlign:'center',maxWidth:300,whiteSpace:'pre-wrap'}}>
      {msg}
    </div>
  );
}

/* ── TaskForm ── */
function TaskForm({task,projects,onSave,onClose}) {
  const isEdit=!!task;
  const [f,setF]=useState(()=>task?{...task}:{title:'',description:'',project:'כללי',urgency:'low',isToday:false,duration:null,stage:'todo'});
  const [autoU,setAutoU]=useState(!isEdit);
  const ref=useRef();
  useEffect(()=>{setTimeout(()=>ref.current?.focus(),80);},[]);

  const onTitle=v=>setF(p=>{
    const n={...p,title:v};
    if(autoU) n.urgency=inferUrgency(v,p.description);
    if(!isEdit&&!p.duration) n.duration=inferDur(v,p.description);
    return n;
  });

  const handleProject=e=>{
    if(e.target.value==='__new__'){
      const p=window.prompt('שם הפרויקט החדש:');
      if(p?.trim()){onSave._addProj?.(p.trim());setF(x=>({...x,project:p.trim()}));}
    } else setF(x=>({...x,project:e.target.value}));
  };

  const submit=e=>{e.preventDefault();if(!f.title.trim())return;onSave(f);};

  const urgOpts=[{k:'urgent',l:'🔴 דחוף',c:'ub-u'},{k:'medium',l:'🟠 בינוני',c:'ub-m'},{k:'low',l:'🟢 רגיל',c:'ub-l'}];
  const durOpts=[{k:null,l:'לא ידוע'},{k:'short',l:"⚡ קצר"},{k:'long',l:"⏰ ממושך"}];
  const stageOpts=[{v:'todo',l:'📋 לביצוע'},{v:'inprogress',l:'⚡ בתהליך'},{v:'done',l:'✅ הושלם'}];

  return (
    <div className="modal-bg" style={{position:'fixed',inset:0,zIndex:40,display:'flex',alignItems:'flex-end',justifyContent:'center',padding:'0 8px 8px'}}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box pop-in w-full" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px 14px',borderBottom:'1.5px solid #f1f5f9'}}>
          <span style={{color:'#1e293b',fontWeight:800,fontSize:17}}>{isEdit?'✏️ עריכת משימה':'✦ משימה חדשה'}</span>
          <button onClick={onClose}
            style={{color:'#94a3b8',fontSize:26,lineHeight:1,cursor:'pointer',background:'none',border:'none',transition:'color .14s'}}
            onMouseEnter={e=>e.target.style.color='#475569'}
            onMouseLeave={e=>e.target.style.color='#94a3b8'}>×</button>
        </div>

        <form onSubmit={submit} style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>

          <input ref={ref} type="text" required placeholder="שם המשימה *"
            value={f.title} onChange={e=>onTitle(e.target.value)}
            className="inp" style={{padding:'12px 14px',fontSize:15,width:'100%'}}/>

          <textarea placeholder="תיאור (אופציונלי)" rows={2} value={f.description||''}
            onChange={e=>setF(p=>({...p,description:e.target.value}))}
            className="inp" style={{padding:'10px 14px',fontSize:13,resize:'none',width:'100%'}}/>

          <div style={{position:'relative'}}>
            <select value={f.project} onChange={handleProject}
              className="inp" style={{padding:'10px 14px 10px 30px',fontSize:13,width:'100%'}}>
              {projects.map(p=><option key={p} value={p}>{p}</option>)}
              <option value="__new__">＋ פרויקט חדש</option>
            </select>
            <span style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:10}}>▾</span>
          </div>

          <div>
            <div style={{fontSize:11,fontWeight:700,color:'#94a3b8',marginBottom:6,letterSpacing:'.06em',textTransform:'uppercase'}}>דחיפות</div>
            <div style={{display:'flex',gap:6}}>
              {urgOpts.map(({k,l,c})=>(
                <button key={k} type="button" className={`ub ${c} ${f.urgency===k?'on':''}`}
                  style={{flex:1}} onClick={()=>{setF(p=>({...p,urgency:k}));setAutoU(false);}}>
                  {l}
                </button>
              ))}
            </div>
            {autoU&&f.title&&<p style={{fontSize:11,color:'#6366f1',marginTop:4,fontWeight:600}}>✨ זוהה אוטומטית</p>}
          </div>

          <div>
            <div style={{fontSize:11,fontWeight:700,color:'#94a3b8',marginBottom:6,letterSpacing:'.06em',textTransform:'uppercase'}}>משך זמן</div>
            <div style={{display:'flex',gap:6}}>
              {durOpts.map(({k,l})=>(
                <button key={String(k)} type="button" className={`db ${f.duration===k?'on':''}`}
                  style={{flex:1}} onClick={()=>setF(p=>({...p,duration:k}))}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button type="button" onClick={()=>setF(p=>({...p,isToday:!p.isToday}))}
              style={{padding:'9px 14px',borderRadius:12,fontSize:13,fontWeight:700,border:'2px solid',cursor:'pointer',transition:'all .14s',
                      background:f.isToday?'#fef9c3':'#f8fafc',
                      borderColor:f.isToday?'#fbbf24':'#e2e8f0',
                      color:f.isToday?'#92400e':'#94a3b8'}}>
              ⭐ {f.isToday?'מסומן להיום':'הוסף להיום'}
            </button>
            <div style={{position:'relative',flex:1,minWidth:120}}>
              <select value={f.stage||'todo'} onChange={e=>setF(p=>({...p,stage:e.target.value}))}
                className="inp" style={{padding:'9px 14px 9px 28px',fontSize:13,width:'100%'}}>
                {stageOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
            </div>
          </div>

          <div style={{display:'flex',gap:8,paddingTop:4}}>
            <button type="submit" className="btn-primary" style={{flex:1,padding:'13px 0',fontSize:14}}>
              {isEdit?'שמור שינויים':'הוסף משימה'}
            </button>
            <button type="button" onClick={onClose} className="btn-ghost"
              style={{padding:'13px 18px',fontSize:14}}>
              ביטול
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ── TaskCard ── */
function TaskCard({task,onToggle,onEdit,onDelete,onDragStart,onDragOver,onDrop,isDragging}) {
  const isDone=task.stage==='done';
  const lp=useRef(null);
  const [press,setPress]=useState(false);
  const startLP=()=>{setPress(true);lp.current=setTimeout(()=>{onDelete(task.id);setPress(false);},800);};
  const stopLP=()=>{clearTimeout(lp.current);setPress(false);};
  const sp=e=>{e.stopPropagation();stopLP();};

  const urg=task.urgency||'low';
  const chkCls=isDone?'chk-done':urg==='urgent'?'chk-u':urg==='medium'?'chk-m':'chk-l';
  const bdgCls=urg==='urgent'?'bu':urg==='medium'?'bm':'bl';
  const urgLabel=urg==='urgent'?'דחוף':urg==='medium'?'בינוני':'רגיל';
  const urgEmoji=urg==='urgent'?'🔴':urg==='medium'?'🟠':'🟢';

  const cls=[
    'task-card card-enter',
    `c-${urg}`,
    isDone?'done-card':'',
    task.isToday&&!isDone?'c-today':'',
    isDragging?'dragging':'',
    press?'pressing':'',
  ].filter(Boolean).join(' ');

  return (
    <div draggable
      onDragStart={()=>onDragStart(task.id)}
      onDragOver={e=>{e.preventDefault();onDragOver(task.id);}}
      onDrop={e=>{e.preventDefault();onDrop(task.id);}}
      onMouseDown={startLP} onMouseUp={stopLP} onMouseLeave={stopLP}
      onTouchStart={startLP} onTouchEnd={stopLP} onTouchMove={stopLP}
      className={cls} style={{padding:'12px 14px'}}>

      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        {/* Checkbox */}
        <button onMouseDown={sp} onTouchStart={sp}
          onClick={e=>{sp(e);onToggle(task.id);}}
          className={`chk ${chkCls}`} style={{marginTop:2,border:'none',outline:'none',background:'transparent',padding:0}}>
          {isDone&&(
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4L4 7.5L10 1" stroke="white" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          )}
        </button>

        {/* Body */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:6}}>
            <p style={{fontSize:14,fontWeight:600,lineHeight:1.45,flex:1,wordBreak:'break-word',
                        color:isDone?'#94a3b8':'#1e293b',
                        textDecoration:isDone?'line-through':'none'}}>
              {task.isToday&&!isDone&&<span style={{color:'#f59e0b',marginLeft:4}}>⭐</span>}
              {task.title}
            </p>
            <div style={{display:'flex',gap:2,flexShrink:0}}>
              <button onMouseDown={sp} onTouchStart={sp}
                onClick={e=>{sp(e);onEdit(task);}}
                style={{color:'#cbd5e1',fontSize:13,padding:'2px 4px',borderRadius:6,cursor:'pointer',background:'none',border:'none',transition:'color .13s'}}
                onMouseEnter={e=>e.currentTarget.style.color='#6366f1'}
                onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>✏️</button>
              <button onMouseDown={sp} onTouchStart={sp}
                onClick={e=>{sp(e);onDelete(task.id);}}
                style={{color:'#cbd5e1',fontSize:13,padding:'2px 4px',borderRadius:6,cursor:'pointer',background:'none',border:'none',transition:'color .13s'}}
                onMouseEnter={e=>e.currentTarget.style.color='#ef4444'}
                onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>🗑</button>
            </div>
          </div>

          {task.description&&(
            <p className="lc2" style={{fontSize:12,color:'#94a3b8',marginTop:3,lineHeight:1.5}}>
              {task.description}
            </p>
          )}

          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>
            <span className={`bdg ${bdgCls}`}>{urgEmoji} {urgLabel}</span>
            {task.project&&task.project!=='כללי'&&(
              <span className="bdg bp">📁 {task.project}</span>
            )}
            {task.duration==='long' &&<span className="bdg blg">⏰ ממושך</span>}
            {task.duration==='short'&&<span className="bdg bsh">⚡ קצר</span>}
            {task.isToday&&!isDone&&<span className="bdg bty">⭐ להיום</span>}
          </div>

          {task.duration==='long'&&!isDone&&(
            <div className="cal-tip">
              <span style={{fontSize:14}}>📅</span>
              <span style={{fontSize:12,color:'#3b82f6',flex:1,fontWeight:600}}>כדאי לשריין זמן ביומן</span>
              <button onMouseDown={sp} onTouchStart={sp}
                onClick={e=>{sp(e);window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(task.title)}&details=${encodeURIComponent(task.description||'')}`, '_blank');}}
                style={{fontSize:11,fontWeight:700,color:'#fff',background:'#3b82f6',
                        border:'none',borderRadius:8,padding:'4px 10px',cursor:'pointer',transition:'background .13s'}}
                onMouseEnter={e=>e.currentTarget.style.background='#2563eb'}
                onMouseLeave={e=>e.currentTarget.style.background='#3b82f6'}>
                העבר ליומן
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── KanbanBoard ── */
function KanbanBoard({tasks,onEdit,onDelete,onStageChange}) {
  const [dragId,setDragId]=useState(null);
  const [overStage,setOverStage]=useState(null);
  const by=useMemo(()=>{
    const g={todo:[],inprogress:[],done:[]};
    tasks.forEach(t=>{ (g[t.stage]||g.todo).push(t); });
    return g;
  },[tasks]);

  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))',gap:12}}>
      {Object.entries(KANBAN_COLS).map(([stage,cfg])=>(
        <div key={stage} className={`kan-col ${overStage===stage?'kan-drop':''}`}
          onDragOver={e=>{e.preventDefault();setOverStage(stage);}}
          onDragLeave={()=>setOverStage(null)}
          onDrop={e=>{e.preventDefault();if(dragId)onStageChange(dragId,stage);setDragId(null);setOverStage(null);}}>

          <div className={cfg.hdr} style={{padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1.5px solid #f1f5f9'}}>
            <span style={{fontWeight:700,fontSize:13}}>{cfg.icon} {cfg.label}</span>
            <span style={{background:'rgba(0,0,0,.08)',borderRadius:20,fontSize:11,fontWeight:700,padding:'1px 7px'}}>
              {by[stage].length}
            </span>
          </div>

          <div style={{padding:10,minHeight:120,display:'flex',flexDirection:'column',gap:6}}>
            {by[stage].map(task=>{
              const urg=task.urgency||'low';
              const bc=urg==='urgent'?'bu':urg==='medium'?'bm':'bl';
              return (
                <div key={task.id} draggable
                  onDragStart={()=>setDragId(task.id)}
                  onDragEnd={()=>{setDragId(null);setOverStage(null);}}
                  className="kan-card" style={{padding:'10px 12px',opacity:dragId===task.id?.35:1}}>
                  <div style={{display:'flex',justifyContent:'space-between',gap:4}}>
                    <p style={{fontSize:13,fontWeight:600,flex:1,
                                color:stage==='done'?'#94a3b8':'#1e293b',
                                textDecoration:stage==='done'?'line-through':'none',lineHeight:1.35}}>
                      {task.isToday&&<span style={{color:'#f59e0b',marginLeft:3}}>⭐</span>}
                      {task.title}
                    </p>
                    <div style={{display:'flex',gap:1}}>
                      <button onClick={()=>onEdit(task)}
                        style={{fontSize:11,color:'#cbd5e1',padding:'1px 3px',cursor:'pointer',background:'none',border:'none'}}
                        onMouseEnter={e=>e.currentTarget.style.color='#6366f1'}
                        onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>✏️</button>
                      <button onClick={()=>onDelete(task.id)}
                        style={{fontSize:11,color:'#cbd5e1',padding:'1px 3px',cursor:'pointer',background:'none',border:'none'}}
                        onMouseEnter={e=>e.currentTarget.style.color='#ef4444'}
                        onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>🗑</button>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:4,marginTop:6,flexWrap:'wrap'}}>
                    <span className={`bdg ${bc}`} style={{fontSize:10}}>
                      {urg==='urgent'?'🔴':urg==='medium'?'🟠':'🟢'}
                    </span>
                    {task.project&&task.project!=='כללי'&&(
                      <span className="bdg bp" style={{fontSize:10}}>📁 {task.project}</span>
                    )}
                  </div>
                </div>
              );
            })}
            {by[stage].length===0&&(
              <p style={{textAlign:'center',color:'#cbd5e1',fontSize:12,paddingTop:24,paddingBottom:24}}>
                גרור משימה לכאן
              </p>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── App ── */
function App() {
  const [tasks,setTasks]=useState([]);
  const [projects,setProjects]=useState(PROJECTS);
  const [streak,setStreak]=useState({count:0,lastDate:today()});
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState('list');
  const [search,setSearch]=useState('');
  const [fProj,setFProj]=useState('');
  const [fUrg,setFUrg]=useState('');
  const [showDone,setShowDone]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [toast,setToast]=useState(null);
  const [confetti,setConfetti]=useState(false);
  const [saved,setSaved]=useState(false);
  const [dragId,setDragId]=useState(null);
  const dragRef=useRef(null);
  const prevDone=useRef(0);

  useEffect(()=>{
    const d=load();
    if(d){
      setTasks(d.tasks||[]);
      setProjects(d.projects||PROJECTS);
      setStreak(d.streak||{count:0,lastDate:today()});
      prevDone.current=(d.tasks||[]).filter(t=>t.stage==='done'&&t.completedAt?.startsWith(today())).length;
    }
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(!loaded) return;
    localStorage.setItem(STORAGE,JSON.stringify({tasks,projects,streak}));
    setSaved(true);
    const t=setTimeout(()=>setSaved(false),1300);
    return()=>clearTimeout(t);
  },[tasks,projects,streak,loaded]);

  const completedToday=useMemo(()=>
    tasks.filter(t=>t.stage==='done'&&t.completedAt?.startsWith(today())).length
  ,[tasks]);

  useEffect(()=>{
    if(!loaded) return;
    if(completedToday>prevDone.current&&MILESTONES.includes(completedToday)){
      setConfetti(true);
      push(CHEERS[Math.floor(Math.random()*CHEERS.length)],'celebrate');
    }
    prevDone.current=completedToday;
  },[completedToday,loaded]);

  const push=(msg,type='info')=>setToast({msg,type});
  const addProj=useCallback(n=>{if(n)setProjects(p=>[...p,n]);},[]);

  const handleSave=useCallback(form=>{
    if(form.id){
      setTasks(p=>p.map(t=>t.id===form.id?{...t,...form}:t));
      push('✏️ המשימה עודכנה');
    } else {
      setTasks(p=>[{
        id:uid(),title:form.title.trim(),
        description:form.description||'',project:form.project||'כללי',
        urgency:form.urgency||'low',isToday:form.isToday||false,
        duration:form.duration||null,stage:form.stage||'todo',
        createdAt:new Date().toISOString(),completedAt:null,
      },...p]);
      push('✅ המשימה נוספה!');
    }
    setShowForm(false); setEditTask(null);
  },[]);
  handleSave._addProj=addProj;

  const delTask=useCallback(id=>{
    if(!window.confirm('למחוק את המשימה?')) return;
    setTasks(p=>p.filter(t=>t.id!==id)); push('🗑 נמחקה');
  },[]);

  const toggleTask=useCallback(id=>{
    setTasks(p=>p.map(t=>{
      if(t.id!==id) return t;
      const c=t.stage!=='done';
      return{...t,stage:c?'done':'todo',completedAt:c?new Date().toISOString():null};
    }));
  },[]);

  const stageChange=useCallback((id,stage)=>{
    setTasks(p=>p.map(t=>{
      if(t.id!==id) return t;
      const c=stage==='done'&&t.stage!=='done';
      return{...t,stage,completedAt:c?new Date().toISOString():(stage!=='done'?null:t.completedAt)};
    }));
  },[]);

  const dStart=useCallback(id=>{dragRef.current=id;setDragId(id);},[]);
  const dOver=useCallback(()=>{},[]);
  const dDrop=useCallback(tid=>{
    const fid=dragRef.current;
    if(!fid||fid===tid){setDragId(null);return;}
    setTasks(p=>{
      const a=[...p],fi=a.findIndex(t=>t.id===fid),ti=a.findIndex(t=>t.id===tid);
      if(fi<0||ti<0) return p;
      const[m]=a.splice(fi,1);a.splice(ti,0,m);return a;
    });
    setDragId(null);
  },[]);

  const filtered=useMemo(()=>tasks.filter(t=>{
    const q=search.toLowerCase();
    if(q&&!t.title.toLowerCase().includes(q)&&!(t.description||'').toLowerCase().includes(q)) return false;
    if(fProj&&t.project!==fProj) return false;
    if(fUrg&&t.urgency!==fUrg) return false;
    return true;
  }),[tasks,search,fProj,fUrg]);

  const active=filtered.filter(t=>t.stage!=='done');
  const done=filtered.filter(t=>t.stage==='done');
  const todayT=active.filter(t=>t.isToday);
  const urgT=active.filter(t=>t.urgency==='urgent'&&!t.isToday);
  const otherT=active.filter(t=>t.urgency!=='urgent'&&!t.isToday);
  const usedP=useMemo(()=>[...new Set(tasks.map(t=>t.project).filter(Boolean))]  ,[tasks]);

  const cp=task=>({
    task,onToggle:toggleTask,onEdit:setEditTask,onDelete:delTask,
    onDragStart:dStart,onDragOver:dOver,onDrop:dDrop,isDragging:dragId===task.id,
  });

  return (
    <div style={{minHeight:'100vh'}}>

      {/* ── Header ── */}
      <header className="app-header" style={{position:'sticky',top:0,zIndex:30}}>
        <div style={{maxWidth:640,margin:'0 auto',padding:'12px 16px'}}>

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <div>
              <h1 style={{fontSize:19,fontWeight:800,color:'#1e293b',letterSpacing:'-.02em'}}>
                📋 מנהל המשימות
              </h1>
              <p style={{fontSize:11,color:'#94a3b8',marginTop:1,fontWeight:500}}>
                <span style={{color:'#6366f1',fontWeight:700}}>{completedToday}</span>
                <span style={{marginRight:3}}>הושלמו היום</span>
                {streak.count>1&&<span style={{color:'#f97316',fontWeight:700,marginRight:6}}>🔥 {streak.count} ימים ברצף</span>}
              </p>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>setView(v=>v==='list'?'kanban':'list')}
                className={`btn-ghost ${view==='kanban'?'active':''}`}
                style={{padding:'7px 12px',fontSize:12,fontWeight:700}}>
                {view==='kanban'?'📋 רשימה':'📊 קנבן'}
              </button>
              <button onClick={()=>{setEditTask(null);setShowForm(true);}}
                className="btn-primary" style={{padding:'8px 14px',fontSize:13}}>
                ＋ משימה
              </button>
            </div>
          </div>

          {/* Search + filters */}
          <div style={{display:'flex',gap:8}}>
            <div style={{position:'relative',flex:1}}>
              <input type="search" placeholder="חיפוש..." value={search}
                onChange={e=>setSearch(e.target.value)}
                className="inp" style={{width:'100%',padding:'8px 14px 8px 34px',fontSize:13}}/>
              <span style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',
                            color:'#94a3b8',pointerEvents:'none',fontSize:13}}>🔍</span>
            </div>
            <div style={{position:'relative'}}>
              <select value={fProj} onChange={e=>setFProj(e.target.value)}
                className="inp" style={{padding:'8px 26px 8px 10px',fontSize:12,maxWidth:120}}>
                <option value="">📁 הכל</option>
                {usedP.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
              <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
            </div>
            <div style={{position:'relative'}}>
              <select value={fUrg} onChange={e=>setFUrg(e.target.value)}
                className="inp" style={{padding:'8px 26px 8px 10px',fontSize:12}}>
                <option value="">🎯</option>
                <option value="urgent">🔴</option>
                <option value="medium">🟠</option>
                <option value="low">🟢</option>
              </select>
              <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
            </div>
          </div>
        </div>
      </header>

      {/* ── Main ── */}
      <main style={{maxWidth:640,margin:'0 auto',padding:'16px 16px 100px'}}>
        {view==='kanban'?(
          <KanbanBoard tasks={filtered} onEdit={setEditTask} onDelete={delTask} onStageChange={stageChange}/>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:20}}>

            {/* Today */}
            {todayT.length>0&&(
              <div className="today-wrap">
                <div className="today-head" style={{padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:13,fontWeight:700,color:'#78350f'}}>⭐ להיום · {todayT.length} משימות</span>
                  {todayT.length>3&&(
                    <span style={{fontSize:11,color:'#92400e',background:'rgba(251,191,36,.3)',borderRadius:20,padding:'2px 8px',fontWeight:700}}>
                      💡 כדאי לצמצם ל-3
                    </span>
                  )}
                </div>
                <div style={{padding:'10px 12px',display:'flex',flexDirection:'column',gap:6}}>
                  {todayT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}
                </div>
              </div>
            )}

            {/* Urgent */}
            {urgT.length>0&&(
              <div>
                <div className="sec-t">
                  <span className="dot" style={{background:'#f87171'}}></span>
                  דחוף · {urgT.length}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {urgT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}
                </div>
              </div>
            )}

            {/* Other */}
            {otherT.length>0&&(
              <div>
                {(urgT.length>0||todayT.length>0)&&(
                  <div className="sec-t">
                    <span className="dot" style={{background:'#e2e8f0'}}></span>
                    שאר המשימות · {otherT.length}
                  </div>
                )}
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {otherT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}
                </div>
              </div>
            )}

            {/* Empty */}
            {active.length===0&&(
              <div style={{textAlign:'center',padding:'64px 0'}}>
                {tasks.length===0?(
                  <>
                    <div style={{fontSize:52,marginBottom:14}}>🎯</div>
                    <p style={{fontSize:16,fontWeight:700,color:'#64748b',marginBottom:6}}>אין משימות עדיין</p>
                    <p style={{fontSize:13,color:'#94a3b8'}}>לחץ על ＋ משימה כדי להתחיל</p>
                  </>
                ):(
                  <>
                    <div style={{fontSize:40,marginBottom:12}}>🔍</div>
                    <p style={{fontSize:15,fontWeight:700,color:'#64748b'}}>לא נמצאו תוצאות</p>
                    <p style={{fontSize:12,color:'#94a3b8',marginTop:4}}>נסה לשנות את הפילטרים</p>
                  </>
                )}
              </div>
            )}

            {/* Done */}
            {done.length>0&&(
              <div>
                <button onClick={()=>setShowDone(v=>!v)}
                  style={{display:'flex',alignItems:'center',gap:6,fontSize:11,fontWeight:700,
                          color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.06em',
                          background:'none',border:'none',cursor:'pointer',marginBottom:8,transition:'color .13s'}}
                  onMouseEnter={e=>e.currentTarget.style.color='#64748b'}
                  onMouseLeave={e=>e.currentTarget.style.color='#94a3b8'}>
                  <span style={{transition:'transform .18s',transform:showDone?'rotate(90deg)':'none',fontSize:9}}>▶</span>
                  ✅ הושלמו · {done.length}
                </button>
                {showDone&&(
                  <div style={{display:'flex',flexDirection:'column',gap:6,opacity:.6}}>
                    {done.map(t=><TaskCard key={t.id} {...cp(t)}/>)}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </main>

      {/* FAB */}
      <button onClick={()=>{setEditTask(null);setShowForm(true);}} className="fab sm:hidden">＋</button>

      {/* Saved */}
      {saved&&<div className="saved-pill fade-up">✓ נשמר</div>}

      {/* Overlays */}
      {(showForm||editTask)&&(
        <TaskForm task={editTask} projects={projects} onSave={handleSave}
          onClose={()=>{setShowForm(false);setEditTask(null);}}/>
      )}
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      {confetti&&<Confetti onDone={()=>setConfetti(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
