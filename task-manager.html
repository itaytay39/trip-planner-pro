<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מנהל המשימות שלי</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scaleY(1); max-height: 300px; }
      to   { opacity: 0; transform: scaleY(0.95); max-height: 0; overflow: hidden; }
    }
    @keyframes confettiFall {
      0%   { top: -30px; opacity: 1; transform: rotate(0deg); }
      100% { top: 105vh;  opacity: 0; transform: rotate(720deg); }
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes celebrationPop {
      0%   { transform: scale(0.8); opacity: 0; }
      60%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .task-card  { animation: slideIn 0.22s ease; }
    .confetti-item { position: fixed; pointer-events: none; z-index: 9999; animation: confettiFall linear forwards; }
    .toast-popup { animation: toastSlide 0.28s ease; }
    .celebrate-pop { animation: celebrationPop 0.35s ease; }

    .dragging-card { opacity: 0.35; cursor: grabbing; }
    .drag-indicator-top    { border-top: 3px solid #3b82f6 !important; }
    .drag-indicator-bottom { border-bottom: 3px solid #3b82f6 !important; }
    .kanban-drop-target    { background: #dbeafe !important; outline: 2px dashed #3b82f6; }

    ::-webkit-scrollbar       { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    input:focus, textarea:focus, select:focus { outline: none; }
    .today-gradient { background: linear-gradient(135deg, #fef9c3 0%, #fef3c7 100%); }
    .urgent-ring    { box-shadow: 0 0 0 2px rgba(239,68,68,0.25); }
    .line-clamp-2   { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ─── Constants ────────────────────────────────────────────────── */

const PROJECT_LIST = [
  'כללי','הנהלה','עובדים','לקוחות','כספים','שיווק',
  'גיוס עובדים','פיתוח עסקי','הדרכות',
  'פרויקטים בביצוע','משימות אישיות','בית ומשפחה','תכנון אסטרטגי'
];

const U = {
  urgent: { label:'דחוף',   emoji:'🔴', bg:'bg-red-50',    border:'border-red-300',    badge:'bg-red-100 text-red-700',      dot:'bg-red-500'    },
  medium: { label:'בינוני', emoji:'🟠', bg:'bg-orange-50', border:'border-orange-300', badge:'bg-orange-100 text-orange-700', dot:'bg-orange-500' },
  low:    { label:'רגיל',   emoji:'🟢', bg:'bg-white',     border:'border-slate-200',  badge:'bg-green-100 text-green-700',  dot:'bg-green-400'  },
};

const KANBAN = {
  todo:       { label:'לביצוע', icon:'📋', header:'bg-slate-500',  bg:'bg-slate-50'  },
  inprogress: { label:'בתהליך', icon:'⚡', header:'bg-blue-500',   bg:'bg-blue-50'   },
  done:       { label:'הושלם',  icon:'✅', header:'bg-green-500',  bg:'bg-green-50'  },
};

const MILESTONES = [5, 10, 20, 50, 100];
const CHEER = [
  'מעולה! אתה מתקדם בקצב מצוין 🚀',
  'יום פרודוקטיבי במיוחד 👏',
  'אתה מנהל את הזמן כמו מקצוען! ⭐',
  'כל הכבוד! המשך כך 🏆',
  'נהדר! אתה על גל 🌊',
];

const STORAGE_KEY = 'taskmanager_v3';

/* ─── Helpers ───────────────────────────────────────────────────── */

let _uidCounter = 0;
function uid() { return `${Date.now()}-${++_uidCounter}-${Math.random().toString(36).slice(2,6)}`; }

function todayStr() { return new Date().toISOString().slice(0,10); }

function inferUrgency(title, desc = '') {
  const t = (title + ' ' + desc).toLowerCase();
  if (['דחוף','היום','לקוח','מכרז','asap','מיד','עכשיו','חירום'].some(k => t.includes(k))) return 'urgent';
  if (['השבוע','בקרוב','חשוב','מחר','important'].some(k => t.includes(k))) return 'medium';
  return 'low';
}

function inferDuration(title, desc = '') {
  const t = (title + ' ' + desc).toLowerCase();
  if (['פגישה','הדרכה','כנס','ישיבה','סדנה','בדיקה מקיפה','עבודה על','meeting','workshop'].some(k => t.includes(k))) return 'long';
  if (['שלח','אשר','בדוק','עדכן','quick','call','שיחה קצרה'].some(k => t.includes(k))) return 'short';
  return null;
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d.streak && d.streak.lastDate && d.streak.lastDate !== todayStr()) {
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
      const yd = yesterday.toISOString().slice(0,10);
      d.streak.count = d.streak.lastDate === yd ? d.streak.count : 0;
      d.streak.lastDate = todayStr();
    }
    return d;
  } catch { return null; }
}

/* ─── Confetti ──────────────────────────────────────────────────── */

function Confetti({ onDone }) {
  const pieces = useMemo(() => Array.from({length:45},(_,i) => ({
    id: i,
    left: Math.random()*100,
    dur:  1.4 + Math.random()*1.8,
    delay: Math.random()*0.9,
    glyph: ['🎉','⭐','✨','🎊','🏆','💫'][Math.floor(Math.random()*6)],
    size:  14 + Math.random()*18,
  })),[]);
  useEffect(() => { const t = setTimeout(onDone, 3200); return ()=>clearTimeout(t); }, []);
  return (
    <div className="fixed inset-0 pointer-events-none z-50">
      {pieces.map(p => (
        <span key={p.id} className="confetti-item"
          style={{left:`${p.left}%`, fontSize:`${p.size}px`,
                  animationDuration:`${p.dur}s`, animationDelay:`${p.delay}s`}}>
          {p.glyph}
        </span>
      ))}
    </div>
  );
}

/* ─── Toast ─────────────────────────────────────────────────────── */

function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3200); return ()=>clearTimeout(t); }, []);
  const bg = type === 'celebrate'
    ? 'bg-gradient-to-r from-purple-600 to-pink-500 text-white'
    : 'bg-gray-800 text-white';
  return (
    <div className={`fixed bottom-8 left-1/2 z-50 toast-popup -translate-x-1/2 px-5 py-3 rounded-2xl shadow-xl text-sm font-semibold text-center max-w-xs whitespace-pre-wrap ${bg}`}>
      {msg}
    </div>
  );
}

/* ─── TaskForm ──────────────────────────────────────────────────── */

function TaskForm({ task, projects, onSave, onClose }) {
  const isEdit = !!task;
  const [f, setF] = useState(() => task
    ? { ...task }
    : { title:'', description:'', project:'כללי', urgency:'low', isToday:false, duration:null, stage:'todo' }
  );
  const [autoU, setAutoU] = useState(!isEdit);
  const titleRef = useRef();

  useEffect(() => { setTimeout(() => titleRef.current?.focus(), 80); }, []);

  const onTitle = v => {
    setF(prev => {
      const next = { ...prev, title: v };
      if (autoU) next.urgency = inferUrgency(v, prev.description);
      if (!isEdit && !prev.duration) next.duration = inferDuration(v, prev.description);
      return next;
    });
  };

  const addProject = () => {
    const name = window.prompt('שם הפרויקט החדש:');
    if (name?.trim()) return name.trim();
    return null;
  };

  const handleProjectChange = e => {
    if (e.target.value === '__new__') {
      const p = addProject();
      if (p) { onSave._addProject?.(p); setF(prev => ({...prev, project: p})); }
    } else {
      setF(prev => ({...prev, project: e.target.value}));
    }
  };

  const submit = e => {
    e.preventDefault();
    if (!f.title.trim()) return;
    onSave(f);
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-40 flex items-end sm:items-center justify-center p-2 sm:p-4"
      onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="bg-white rounded-2xl w-full max-w-lg shadow-2xl celebrate-pop"
        onClick={e => e.stopPropagation()}>

        {/* Header */}
        <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 className="font-bold text-gray-800 text-lg">{isEdit ? '✏️ עריכת משימה' : '➕ משימה חדשה'}</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-3xl leading-none">×</button>
        </div>

        <form onSubmit={submit} className="p-5 space-y-4">
          {/* Title */}
          <input ref={titleRef} type="text" placeholder="שם המשימה *" required
            value={f.title} onChange={e => onTitle(e.target.value)}
            className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:border-blue-400 text-base transition-colors" />

          {/* Description */}
          <textarea placeholder="תיאור (אופציונלי)" rows={2} value={f.description||''}
            onChange={e => setF(p => ({...p, description: e.target.value}))}
            className="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 placeholder-gray-400 focus:border-blue-400 text-sm resize-none transition-colors" />

          {/* Project */}
          <select value={f.project} onChange={handleProjectChange}
            className="w-full border-2 border-gray-200 rounded-xl px-4 py-2.5 text-gray-700 bg-white focus:border-blue-400 text-sm transition-colors">
            {projects.map(p => <option key={p} value={p}>{p}</option>)}
            <option value="__new__">＋ פרויקט חדש</option>
          </select>

          {/* Urgency */}
          <div>
            <label className="text-xs font-bold text-gray-500 mb-1.5 block">דחיפות</label>
            <div className="flex gap-2">
              {Object.entries(U).map(([k,v]) => {
                const active = f.urgency === k;
                const colors = k==='urgent' ? 'bg-red-500 text-white border-red-500'
                             : k==='medium' ? 'bg-orange-400 text-white border-orange-400'
                             :                'bg-green-500 text-white border-green-500';
                return (
                  <button key={k} type="button"
                    onClick={() => { setF(p => ({...p, urgency:k})); setAutoU(false); }}
                    className={`flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all
                      ${active ? colors : 'border-gray-200 text-gray-500 hover:border-gray-300 bg-white'}`}>
                    {v.emoji} {v.label}
                  </button>
                );
              })}
            </div>
            {autoU && f.title && <p className="text-xs text-blue-500 mt-1">✨ זוהה אוטומטית</p>}
          </div>

          {/* Duration */}
          <div>
            <label className="text-xs font-bold text-gray-500 mb-1.5 block">משך זמן</label>
            <div className="flex gap-2">
              {[{k:null,l:'לא ידוע'},{k:'short',l:"⚡ קצר (≤15')"},{k:'long',l:"⏰ ממושך (≥30')"}].map(({k,l}) => (
                <button key={String(k)} type="button"
                  onClick={() => setF(p => ({...p, duration:k}))}
                  className={`flex-1 py-2 rounded-xl text-xs font-semibold border-2 transition-all
                    ${f.duration===k ? 'bg-blue-500 text-white border-blue-500' : 'border-gray-200 text-gray-500 hover:border-gray-300 bg-white'}`}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          {/* Today + Stage */}
          <div className="flex gap-2 flex-wrap">
            <button type="button" onClick={() => setF(p => ({...p, isToday:!p.isToday}))}
              className={`flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold border-2 transition-all
                ${f.isToday ? 'border-yellow-400 bg-yellow-100 text-yellow-700' : 'border-gray-200 text-gray-500 hover:border-yellow-200 bg-white'}`}>
              ⭐ {f.isToday ? 'מסומן להיום' : 'הוסף להיום'}
            </button>
            <select value={f.stage||'todo'} onChange={e => setF(p => ({...p, stage:e.target.value}))}
              className="border-2 border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 bg-white focus:border-blue-400 transition-colors">
              <option value="todo">📋 לביצוע</option>
              <option value="inprogress">⚡ בתהליך</option>
              <option value="done">✅ הושלם</option>
            </select>
          </div>

          {/* Buttons */}
          <div className="flex gap-2 pt-1">
            <button type="submit"
              className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors">
              {isEdit ? 'שמור שינויים' : 'הוסף משימה'}
            </button>
            <button type="button" onClick={onClose}
              className="px-5 py-3 border-2 border-gray-200 text-gray-600 rounded-xl hover:bg-gray-50 transition-colors font-semibold">
              ביטול
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ─── TaskCard ──────────────────────────────────────────────────── */

function TaskCard({ task, onToggle, onEdit, onDelete, onDragStart, onDragOver, onDrop, isDragging }) {
  const cfg = U[task.urgency] || U.low;
  const isDone = task.stage === 'done';
  const lpRef = useRef(null);
  const [pressing, setPressing] = useState(false);

  const startLP = () => {
    setPressing(true);
    lpRef.current = setTimeout(() => {
      onDelete(task.id);
      setPressing(false);
    }, 750);
  };
  const cancelLP = () => {
    clearTimeout(lpRef.current);
    setPressing(false);
  };

  const stop = e => { e.stopPropagation(); cancelLP(); };

  return (
    <div draggable
      onDragStart={() => onDragStart(task.id)}
      onDragOver={e => { e.preventDefault(); onDragOver(task.id); }}
      onDrop={e => { e.preventDefault(); onDrop(task.id); }}
      onMouseDown={startLP} onMouseUp={cancelLP} onMouseLeave={cancelLP}
      onTouchStart={startLP} onTouchEnd={cancelLP} onTouchMove={cancelLP}
      className={`task-card rounded-2xl border-2 p-3 sm:p-4 select-none transition-all cursor-grab active:cursor-grabbing
        ${cfg.bg} ${cfg.border}
        ${isDragging ? 'dragging-card' : ''}
        ${isDone ? 'opacity-60' : ''}
        ${task.urgency==='urgent' && !isDone ? 'urgent-ring' : ''}
        ${pressing ? 'scale-95' : ''}`}>

      <div className="flex items-start gap-3">
        {/* Checkbox */}
        <button onMouseDown={stop} onTouchStart={stop}
          onClick={e => { stop(e); onToggle(task.id); }}
          className={`mt-0.5 w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-all
            ${isDone ? 'bg-green-500 border-green-500' : `${cfg.dot} border-current opacity-60 hover:opacity-100`}`}>
          {isDone && <span className="text-white text-xs font-bold">✓</span>}
        </button>

        {/* Body */}
        <div className="flex-1 min-w-0">
          <div className="flex items-start justify-between gap-2">
            <p className={`text-sm sm:text-base font-semibold text-gray-800 leading-snug break-words flex-1
              ${isDone ? 'line-through text-gray-400' : ''}`}>
              {task.isToday && !isDone && <span className="text-yellow-500 ml-1">⭐</span>}
              {task.title}
            </p>
            <div className="flex items-center gap-0.5 flex-shrink-0">
              <button onMouseDown={stop} onTouchStart={stop}
                onClick={e => { stop(e); onEdit(task); }}
                className="text-gray-300 hover:text-blue-500 p-1 rounded-lg transition-colors text-sm">✏️</button>
              <button onMouseDown={stop} onTouchStart={stop}
                onClick={e => { stop(e); onDelete(task.id); }}
                className="text-gray-300 hover:text-red-400 p-1 rounded-lg transition-colors text-sm">🗑</button>
            </div>
          </div>

          {task.description && (
            <p className="text-xs text-gray-500 mt-0.5 line-clamp-2">{task.description}</p>
          )}

          {/* Badges */}
          <div className="flex items-center gap-1.5 mt-2 flex-wrap">
            <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${cfg.badge}`}>
              {cfg.emoji} {cfg.label}
            </span>
            {task.project && task.project !== 'כללי' && (
              <span className="text-xs px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium">
                📁 {task.project}
              </span>
            )}
            {task.duration === 'long'  && <span className="text-xs px-2 py-0.5 rounded-full bg-purple-100 text-purple-600">⏰ ממושך</span>}
            {task.duration === 'short' && <span className="text-xs px-2 py-0.5 rounded-full bg-teal-100 text-teal-600">⚡ קצר</span>}
          </div>

          {/* Calendar tip */}
          {task.duration === 'long' && !isDone && (
            <div className="mt-2 bg-blue-50 border border-blue-100 rounded-xl p-2.5 flex items-center gap-2">
              <span>📅</span>
              <span className="text-xs text-blue-700">כדאי לשריין זמן ביומן</span>
              <button onMouseDown={stop} onTouchStart={stop}
                onClick={e => {
                  stop(e);
                  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(task.title)}&details=${encodeURIComponent(task.description||'')}`;
                  window.open(url,'_blank');
                }}
                className="mr-auto text-xs bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg transition-colors font-medium">
                העבר ליומן
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ─── KanbanBoard ───────────────────────────────────────────────── */

function KanbanBoard({ tasks, onEdit, onDelete, onStageChange }) {
  const [dragId, setDragId] = useState(null);
  const [overStage, setOverStage] = useState(null);

  const byStage = useMemo(() => {
    const g = { todo:[], inprogress:[], done:[] };
    tasks.forEach(t => { if(g[t.stage]) g[t.stage].push(t); else g.todo.push(t); });
    return g;
  }, [tasks]);

  return (
    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
      {Object.entries(KANBAN).map(([stage, cfg]) => (
        <div key={stage}
          onDragOver={e => { e.preventDefault(); setOverStage(stage); }}
          onDragLeave={() => setOverStage(null)}
          onDrop={e => { e.preventDefault(); if(dragId) onStageChange(dragId, stage); setDragId(null); setOverStage(null); }}
          className={`rounded-2xl overflow-hidden border-2 transition-all
            ${overStage===stage ? 'border-blue-400 kanban-drop-target' : 'border-transparent'}`}>

          <div className={`${cfg.header} text-white px-4 py-3 flex items-center justify-between`}>
            <span className="font-bold text-sm">{cfg.icon} {cfg.label}</span>
            <span className="bg-white/20 text-xs px-2 py-0.5 rounded-full">{byStage[stage].length}</span>
          </div>

          <div className={`${cfg.bg} p-2.5 min-h-36 space-y-2`}>
            {byStage[stage].map(task => {
              const uc = U[task.urgency]||U.low;
              return (
                <div key={task.id} draggable
                  onDragStart={() => setDragId(task.id)}
                  onDragEnd={() => { setDragId(null); setOverStage(null); }}
                  className={`bg-white rounded-xl p-3 shadow-sm border-2 ${uc.border} cursor-grab
                    ${dragId===task.id ? 'opacity-40' : ''}`}>
                  <div className="flex items-start justify-between gap-1">
                    <p className={`text-sm font-semibold text-gray-800 flex-1 ${stage==='done' ? 'line-through text-gray-400' : ''}`}>
                      {task.isToday && <span className="text-yellow-500 ml-1">⭐</span>}
                      {task.title}
                    </p>
                    <div className="flex gap-0.5 flex-shrink-0">
                      <button onClick={() => onEdit(task)} className="text-gray-300 hover:text-blue-500 text-xs p-0.5">✏️</button>
                      <button onClick={() => onDelete(task.id)} className="text-gray-300 hover:text-red-400 text-xs p-0.5">🗑</button>
                    </div>
                  </div>
                  <div className="flex gap-1 mt-1.5 flex-wrap">
                    <span className={`text-xs px-1.5 py-0.5 rounded-full ${uc.badge}`}>{uc.emoji}</span>
                    {task.project && task.project!=='כללי' && (
                      <span className="text-xs px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-500">📁 {task.project}</span>
                    )}
                  </div>
                </div>
              );
            })}
            {byStage[stage].length === 0 && (
              <p className="text-center text-gray-400 text-xs py-8">גרור משימה לכאן</p>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── App ───────────────────────────────────────────────────────── */

function App() {
  const [tasks,    setTasks]    = useState([]);
  const [projects, setProjects] = useState(PROJECT_LIST);
  const [streak,   setStreak]   = useState({ count:0, lastDate: todayStr() });
  const [loaded,   setLoaded]   = useState(false);

  const [view,           setView]           = useState('list');
  const [search,         setSearch]         = useState('');
  const [filterProject,  setFilterProject]  = useState('');
  const [filterUrgency,  setFilterUrgency]  = useState('');
  const [showCompleted,  setShowCompleted]  = useState(false);
  const [showForm,       setShowForm]       = useState(false);
  const [editTask,       setEditTask]       = useState(null);
  const [toast,          setToast]          = useState(null);
  const [confetti,       setConfetti]       = useState(false);
  const [savedBlink,     setSavedBlink]     = useState(false);
  const [dragId,         setDragId]         = useState(null);

  const prevCompletedRef = useRef(0);

  /* Load */
  useEffect(() => {
    const d = loadFromStorage();
    if (d) {
      setTasks(d.tasks || []);
      setProjects(d.projects || PROJECT_LIST);
      setStreak(d.streak || { count:0, lastDate: todayStr() });
      prevCompletedRef.current = (d.tasks||[]).filter(t =>
        t.stage==='done' && t.completedAt?.startsWith(todayStr())
      ).length;
    }
    setLoaded(true);
  }, []);

  /* Save */
  useEffect(() => {
    if (!loaded) return;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks, projects, streak }));
    setSavedBlink(true);
    const t = setTimeout(() => setSavedBlink(false), 1400);
    return () => clearTimeout(t);
  }, [tasks, projects, streak, loaded]);

  /* Derived stats */
  const completedToday = useMemo(() =>
    tasks.filter(t => t.stage==='done' && t.completedAt?.startsWith(todayStr())).length
  , [tasks]);

  /* Milestone check */
  useEffect(() => {
    if (!loaded) return;
    if (completedToday > prevCompletedRef.current && MILESTONES.includes(completedToday)) {
      setConfetti(true);
      showToast(CHEER[Math.floor(Math.random()*CHEER.length)], 'celebrate');
    }
    prevCompletedRef.current = completedToday;
  }, [completedToday, loaded]);

  /* Toast helper */
  const showToast = (msg, type='success') => setToast({ msg, type });

  /* CRUD */
  const addProject = useCallback((name) => {
    if (name) setProjects(p => [...p, name]);
  }, []);

  const handleSave = useCallback((form) => {
    if (form.id) {
      setTasks(p => p.map(t => t.id===form.id ? { ...t, ...form } : t));
      showToast('✏️ המשימה עודכנה');
    } else {
      const t = {
        id: uid(), title: form.title.trim(),
        description: form.description||'',
        project: form.project||'כללי',
        urgency: form.urgency||'low',
        isToday: form.isToday||false,
        duration: form.duration||null,
        stage: form.stage||'todo',
        createdAt: new Date().toISOString(),
        completedAt: null,
      };
      setTasks(p => [t, ...p]);
      showToast('✅ המשימה נוספה!');
    }
    setShowForm(false);
    setEditTask(null);
  }, []);

  // Attach addProject to handleSave so TaskForm can use it
  handleSave._addProject = addProject;

  const deleteTask = useCallback((id) => {
    if (!window.confirm('למחוק את המשימה?')) return;
    setTasks(p => p.filter(t => t.id!==id));
    showToast('🗑 נמחקה');
  }, []);

  const toggleTask = useCallback((id) => {
    setTasks(p => p.map(t => {
      if (t.id!==id) return t;
      const completing = t.stage!=='done';
      return {
        ...t,
        stage: completing ? 'done' : 'todo',
        completedAt: completing ? new Date().toISOString() : null,
      };
    }));
    if (completedToday > 0 || tasks.find(t=>t.id===id)?.stage!=='done') {
      setStreak(s => ({ count: s.lastDate===todayStr() ? s.count : s.count+1, lastDate: todayStr() }));
    }
  }, [tasks, completedToday]);

  const changeStage = useCallback((id, stage) => {
    setTasks(p => p.map(t => {
      if (t.id!==id) return t;
      const completing = stage==='done' && t.stage!=='done';
      return { ...t, stage, completedAt: completing ? new Date().toISOString() : (stage!=='done' ? null : t.completedAt) };
    }));
  }, []);

  /* Drag & Drop (list) */
  const handleDragStart = useCallback((id) => setDragId(id), []);
  const dragIdRef = useRef(null);
  useEffect(() => { dragIdRef.current = dragId; }, [dragId]);

  const handleDragOver = useCallback(() => {}, []);
  const handleDrop = useCallback((targetId) => {
    const from = dragIdRef.current;
    if (!from || from===targetId) { setDragId(null); return; }
    setTasks(p => {
      const arr = [...p];
      const fi = arr.findIndex(t => t.id===from);
      const ti = arr.findIndex(t => t.id===targetId);
      if (fi===-1||ti===-1) return p;
      const [moved] = arr.splice(fi,1);
      arr.splice(ti,0,moved);
      return arr;
    });
    setDragId(null);
  }, []);

  /* Filter */
  const filtered = useMemo(() => tasks.filter(t => {
    const q = search.toLowerCase();
    if (q && !t.title.toLowerCase().includes(q) && !(t.description||'').toLowerCase().includes(q)) return false;
    if (filterProject && t.project!==filterProject) return false;
    if (filterUrgency && t.urgency!==filterUrgency) return false;
    return true;
  }), [tasks, search, filterProject, filterUrgency]);

  const active   = filtered.filter(t => t.stage!=='done');
  const done     = filtered.filter(t => t.stage==='done');
  const todayTasks   = active.filter(t => t.isToday);
  const urgentTasks  = active.filter(t => t.urgency==='urgent' && !t.isToday);
  const otherTasks   = active.filter(t => t.urgency!=='urgent' && !t.isToday);

  const usedProjects = useMemo(() => [...new Set(tasks.map(t=>t.project).filter(Boolean))],[tasks]);

  const cardProps = (task) => ({
    task, onToggle: toggleTask, onEdit: setEditTask,
    onDelete: deleteTask,
    onDragStart: handleDragStart, onDragOver: handleDragOver, onDrop: handleDrop,
    isDragging: dragId===task.id,
  });

  const openForm = () => { setEditTask(null); setShowForm(true); };
  const closeForm = () => { setShowForm(false); setEditTask(null); };

  return (
    <div className="min-h-screen bg-slate-100">

      {/* ── Header ── */}
      <header className="bg-white shadow-sm sticky top-0 z-30">
        <div className="max-w-2xl mx-auto px-4 py-3">

          <div className="flex items-center justify-between mb-2.5">
            <div>
              <h1 className="text-xl font-bold text-gray-800">📋 מנהל המשימות</h1>
              <p className="text-xs text-gray-500 mt-0.5">
                ✅ <strong>{completedToday}</strong> הושלמו היום
                {streak.count > 1 && <span className="mr-2 text-orange-500 font-semibold">🔥 {streak.count} ימים ברצף</span>}
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={() => setView(v => v==='list' ? 'kanban' : 'list')}
                className={`text-sm px-3 py-1.5 rounded-xl font-semibold border-2 transition-all
                  ${view==='kanban' ? 'bg-purple-600 text-white border-purple-600' : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300'}`}>
                {view==='kanban' ? '📋 רשימה' : '📊 קנבן'}
              </button>
              <button onClick={openForm}
                className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-xl text-sm transition-all shadow-sm">
                ＋ משימה
              </button>
            </div>
          </div>

          {/* Search & Filters */}
          <div className="flex gap-2">
            <div className="relative flex-1">
              <input type="search" placeholder="חיפוש משימה..." value={search}
                onChange={e => setSearch(e.target.value)}
                className="w-full border-2 border-gray-200 rounded-xl pr-4 pl-8 py-2 text-sm text-gray-700 bg-gray-50 focus:border-blue-300 focus:bg-white transition-all" />
              <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm pointer-events-none">🔍</span>
            </div>
            <select value={filterProject} onChange={e => setFilterProject(e.target.value)}
              className="border-2 border-gray-200 rounded-xl px-2 py-2 text-xs text-gray-600 bg-gray-50 focus:border-blue-300 transition-colors max-w-28">
              <option value="">📁 הכל</option>
              {usedProjects.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
            <select value={filterUrgency} onChange={e => setFilterUrgency(e.target.value)}
              className="border-2 border-gray-200 rounded-xl px-2 py-2 text-xs text-gray-600 bg-gray-50 focus:border-blue-300 transition-colors">
              <option value="">🎯 הכל</option>
              <option value="urgent">🔴</option>
              <option value="medium">🟠</option>
              <option value="low">🟢</option>
            </select>
          </div>
        </div>
      </header>

      {/* ── Main ── */}
      <main className="max-w-2xl mx-auto px-4 py-4 pb-28 space-y-4">

        {view === 'kanban' ? (
          <KanbanBoard tasks={filtered} onEdit={setEditTask} onDelete={deleteTask} onStageChange={changeStage} />
        ) : (
          <>
            {/* Today */}
            {todayTasks.length > 0 && (
              <section className="today-gradient rounded-2xl border-2 border-yellow-300 overflow-hidden">
                <div className="bg-yellow-400 px-4 py-2.5 flex items-center justify-between">
                  <h2 className="font-bold text-yellow-900 text-sm">⭐ להיום — {todayTasks.length} משימות</h2>
                  {todayTasks.length > 3 && (
                    <span className="text-xs text-yellow-800 bg-yellow-200 px-2 py-0.5 rounded-full">💡 כדאי לצמצם ל-3</span>
                  )}
                </div>
                <div className="p-3 space-y-2">
                  {todayTasks.map(t => <TaskCard key={t.id} {...cardProps(t)} />)}
                </div>
              </section>
            )}

            {/* Urgent */}
            {urgentTasks.length > 0 && (
              <section>
                <h2 className="text-xs font-bold text-red-500 mb-2 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-red-500 inline-block animate-pulse"></span>
                  דחוף · {urgentTasks.length}
                </h2>
                <div className="space-y-2">
                  {urgentTasks.map(t => <TaskCard key={t.id} {...cardProps(t)} />)}
                </div>
              </section>
            )}

            {/* Other */}
            {otherTasks.length > 0 && (
              <section>
                {(urgentTasks.length > 0 || todayTasks.length > 0) && (
                  <h2 className="text-xs font-bold text-gray-400 mb-2 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-gray-400 inline-block"></span>
                    שאר המשימות · {otherTasks.length}
                  </h2>
                )}
                <div className="space-y-2">
                  {otherTasks.map(t => <TaskCard key={t.id} {...cardProps(t)} />)}
                </div>
              </section>
            )}

            {/* Empty state */}
            {active.length === 0 && (
              <div className="text-center py-20 text-gray-400">
                {tasks.length === 0 ? (
                  <>
                    <div className="text-6xl mb-4">🎯</div>
                    <p className="text-lg font-semibold text-gray-500 mb-1">אין משימות עדיין</p>
                    <p className="text-sm">לחץ על ＋ משימה כדי להתחיל</p>
                  </>
                ) : (
                  <>
                    <div className="text-5xl mb-3">🔍</div>
                    <p className="text-base font-semibold text-gray-500">לא נמצאו תוצאות</p>
                    <p className="text-sm">נסה לשנות את הפילטרים</p>
                  </>
                )}
              </div>
            )}

            {/* Completed */}
            {done.length > 0 && (
              <section>
                <button onClick={() => setShowCompleted(v => !v)}
                  className="flex items-center gap-2 text-sm text-gray-400 hover:text-gray-600 mb-2 font-semibold transition-colors w-full">
                  <span className={`text-xs transition-transform duration-200 ${showCompleted ? 'rotate-90' : ''}`}>▶</span>
                  ✅ הושלמו · {done.length}
                </button>
                {showCompleted && (
                  <div className="space-y-2 opacity-60">
                    {done.map(t => <TaskCard key={t.id} {...cardProps(t)} />)}
                  </div>
                )}
              </section>
            )}
          </>
        )}
      </main>

      {/* ── FAB (mobile) ── */}
      <button onClick={openForm}
        className="fixed bottom-6 left-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 text-3xl leading-none shadow-xl flex items-center justify-center transition-all hover:scale-110 sm:hidden z-20">
        ＋
      </button>

      {/* ── Auto-save indicator ── */}
      {savedBlink && (
        <div className="fixed bottom-6 right-4 bg-gray-800/75 text-white text-xs px-3 py-1.5 rounded-full z-30 pointer-events-none">
          ✓ נשמר
        </div>
      )}

      {/* ── Modals / Overlays ── */}
      {(showForm || editTask) && (
        <TaskForm task={editTask} projects={projects} onSave={handleSave} onClose={closeForm} />
      )}
      {toast    && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
      {confetti && <Confetti onDone={() => setConfetti(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
