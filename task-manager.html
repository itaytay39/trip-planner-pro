<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>מנהל המשימות</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { font-family: 'Heebo', 'Arial Hebrew', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #f5f7ff; min-height: 100vh; margin: 0; }

    @keyframes slideDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    @keyframes fadeUp    { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
    @keyframes popIn     { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }
    @keyframes confetti  { 0%{top:-20px;opacity:1} 85%{opacity:1} 100%{top:108vh;opacity:0;transform:rotate(480deg)} }

    .enter   { animation: slideDown .2s cubic-bezier(.34,1.4,.64,1); }
    .pop-in  { animation: popIn .25s cubic-bezier(.34,1.4,.64,1); }
    .fade-up { animation: fadeUp .22s ease; }
    .conf    { position:fixed;pointer-events:none;z-index:9999;animation:confetti linear forwards; }

    /* ── Header ── */
    .hdr {
      background: #fff;
      border-bottom: 1px solid #e8edf5;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
      position: sticky; top: 0; z-index: 30;
    }

    /* ── Task card ── */
    .card {
      background: #fff;
      border-radius: 18px;
      border-right: 4px solid #e2e8f0;
      box-shadow: 0 1px 3px rgba(0,0,0,.05), 0 2px 10px rgba(0,0,0,.04);
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: pointer;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    .card:active { transform: scale(.985); }
    .card.u { border-right-color: #f87171; background: #fffafa; }
    .card.m { border-right-color: #fb923c; background: #fffdf9; }
    .card.l { border-right-color: #86efac; }
    .card.td{ border-right-color: #818cf8; }
    .card.dn{ border-right-color: #e2e8f0; background: #fafbfc; }
    .card.dr{ opacity: .35; }

    /* ── Today ── */
    .today-wrap {
      background: linear-gradient(135deg,#fffbeb,#fef9c3);
      border: 2px solid #fde68a;
      border-radius: 20px; overflow: hidden;
    }
    .today-hdr { background: linear-gradient(90deg,#fde68a,#fcd34d); border-bottom: 1px solid #fbbf24; }

    /* ── Buttons ── */
    .btn-add {
      background: linear-gradient(135deg,#6366f1,#7c3aed);
      color: #fff; font-weight: 700; font-size: 15px;
      border-radius: 14px; border: none; cursor: pointer;
      box-shadow: 0 3px 10px rgba(99,102,241,.35);
      transition: all .15s ease;
      min-height: 44px; padding: 0 18px;
      display: flex; align-items: center; gap: 4px;
    }
    .btn-add:active { transform: scale(.96); }

    .btn-ico {
      background: #f1f5f9; border: none; border-radius: 12px;
      color: #64748b; font-size: 18px; cursor: pointer;
      min-width: 44px; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      transition: background .13s;
    }
    .btn-ico:active { background: #e2e8f0; }
    .btn-ico.on { background: #eef2ff; color: #6366f1; }

    .btn-view {
      background: #f1f5f9; color: #64748b; font-size: 13px; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      min-height: 40px; padding: 0 14px;
      transition: all .13s;
    }
    .btn-view:active { background: #e2e8f0; }
    .btn-view.on { background: #eef2ff; color: #6366f1; }

    /* ── Inputs ── */
    .inp {
      background: #f8fafc; border: 2px solid #e8edf5;
      border-radius: 14px; color: #1e293b; font-size: 15px;
      transition: border-color .14s, background .14s;
      min-height: 48px; padding: 0 14px; width: 100%;
    }
    .inp::placeholder { color: #94a3b8; }
    .inp:focus { background: #fff; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.1); outline: none; }
    textarea.inp { min-height: auto; padding: 12px 14px; resize: none; line-height: 1.5; }
    select.inp { appearance: none; color: #475569; cursor: pointer; }

    /* ── Urgency buttons ── */
    .ub { border-radius: 14px; border: 2px solid; font-weight: 700; font-size: 14px; transition: all .14s; padding: 12px 0; cursor: pointer; min-height: 48px; }
    .u-u    { border-color: #fca5a5; background: #fff5f5; color: #ef4444; }
    .u-u.on { background: #ef4444; border-color: #ef4444; color: #fff; }
    .u-m    { border-color: #fdba74; background: #fff8f0; color: #f97316; }
    .u-m.on { background: #f97316; border-color: #f97316; color: #fff; }
    .u-l    { border-color: #86efac; background: #f0fdf4; color: #16a34a; }
    .u-l.on { background: #16a34a; border-color: #16a34a; color: #fff; }

    .db     { border-radius: 12px; border: 2px solid #e2e8f0; font-weight: 600; font-size: 13px; padding: 10px 0; cursor: pointer; color: #94a3b8; background: #f8fafc; transition: all .14s; }
    .db.on  { border-color: #818cf8; background: #eef2ff; color: #6366f1; }

    /* ── Checkbox ── */
    .chk {
      width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; transition: all .15s ease;
      background: transparent;
    }
    .chk-u { border-color: #fca5a5; }
    .chk-u:hover, .chk-u:active { background: #fee2e2; }
    .chk-m { border-color: #fdba74; }
    .chk-m:hover, .chk-m:active { background: #ffedd5; }
    .chk-l { border-color: #86efac; }
    .chk-l:hover, .chk-l:active { background: #dcfce7; }
    .chk-done { border-color: #6366f1 !important; background: #6366f1 !important; }

    /* ── Badges ── */
    .b { border-radius: 20px; font-size: 12px; font-weight: 700; padding: 3px 10px; }
    .bu { background: #fee2e2; color: #dc2626; }
    .bm { background: #ffedd5; color: #ea580c; }
    .bl { background: #f1f5f9; color: #64748b; }
    .bp { background: #ede9fe; color: #7c3aed; }
    .blg{ background: #f3e8ff; color: #9333ea; }
    .bsh{ background: #ccfbf1; color: #0d9488; }
    .bty{ background: #e0e7ff; color: #4338ca; }

    /* ── Search bar ── */
    .search-bar { overflow: hidden; transition: max-height .25s ease, opacity .25s ease; }
    .search-bar.open  { max-height: 80px; opacity: 1; }
    .search-bar.closed{ max-height: 0;   opacity: 0; }

    /* ── Modal ── */
    .modal-bg  { background: rgba(15,23,42,.5); backdrop-filter: blur(8px); position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 env(safe-area-inset-bottom,0); }
    .modal-box { background: #fff; border-radius: 28px 28px 0 0; width: 100%; max-width: 520px; max-height: 96vh; overflow-y: auto; box-shadow: 0 -8px 40px rgba(0,0,0,.18); }

    /* ── Toast ── */
    .toast { background: #1e293b; color: #e2e8f0; border-radius: 16px; box-shadow: 0 8px 28px rgba(0,0,0,.2); font-weight: 700; font-size: 14px; position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 13px 24px; white-space: nowrap; }
    .toast-c { background: linear-gradient(135deg,#4338ca,#7c3aed); color: #e0e7ff; }

    /* ── Cal tip ── */
    .cal { background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 12px; padding: 10px 12px; margin-top: 10px; display: flex; align-items: center; gap: 8px; }

    /* ── Kanban ── */
    .kcol { background: #fff; border: 1.5px solid #e8edf5; border-radius: 20px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
    .kcol.kd { border-color: #818cf8; background: #f5f3ff; }
    .kcard { background: #f8fafc; border: 1.5px solid #e8edf5; border-radius: 12px; padding: 10px 12px; cursor: grab; transition: all .13s; }
    .kcard:active { transform: scale(.97); }

    /* ── Bottom nav area ── */
    .fab {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg,#6366f1,#7c3aed);
      color: #fff; font-size: 15px; font-weight: 700;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(99,102,241,.45);
      padding: 0 28px; height: 52px;
      display: flex; align-items: center; gap: 8px;
      transition: all .17s ease; z-index: 20;
    }
    .fab:active { transform: translateX(-50%) scale(.96); }

    /* ── Saved ── */
    .saved { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px; z-index: 40; box-shadow: 0 2px 8px rgba(34,197,94,.35); pointer-events: none; }

    /* ── Section title ── */
    .st { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }

    .lc2 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── Constants ── */
const PROJECTS = ['כללי','הנהלה','עובדים','לקוחות','כספים','שיווק','גיוס עובדים','פיתוח עסקי','הדרכות','פרויקטים בביצוע','משימות אישיות','בית ומשפחה','תכנון אסטרטגי'];
const KCols = { todo:{l:'לביצוע',i:'📋',h:'#f1f5f9',ht:'#64748b'}, inprogress:{l:'בתהליך',i:'⚡',h:'#eef2ff',ht:'#6366f1'}, done:{l:'הושלם',i:'✅',h:'#f0fdf4',ht:'#16a34a'} };
const MILES=[5,10,20,50]; const CHEERS=['מעולה! 🚀 אתה מתקדם!','יום פרודוקטיבי 👏','מנהל זמן מקצועי ⭐','כל הכבוד! המשך כך 🏆'];
const STORE='tm_v6';

/* ── Helpers ── */
let n=0; const uid=()=>`${Date.now()}-${++n}`;
const today=()=>new Date().toISOString().slice(0,10);
function iUrg(t,d=''){const s=(t+' '+d).toLowerCase();if(['דחוף','היום','לקוח','מכרז','asap','מיד'].some(k=>s.includes(k)))return 'urgent';if(['השבוע','חשוב','מחר','בקרוב'].some(k=>s.includes(k)))return 'medium';return'low';}
function iDur(t,d=''){const s=(t+' '+d).toLowerCase();if(['פגישה','הדרכה','ישיבה','כנס','meeting'].some(k=>s.includes(k)))return'long';if(['שלח','אשר','בדוק','עדכן','call'].some(k=>s.includes(k)))return'short';return null;}
function load(){try{const r=JSON.parse(localStorage.getItem(STORE)||'null');if(!r)return null;if(r.streak?.lastDate&&r.streak.lastDate!==today()){const yd=new Date();yd.setDate(yd.getDate()-1);r.streak.count=r.streak.lastDate===yd.toISOString().slice(0,10)?r.streak.count:0;r.streak.lastDate=today();}return r;}catch{return null;}}

/* ── Confetti ── */
function Confetti({onDone}){
  const ps=useMemo(()=>Array.from({length:40},(_,i)=>({id:i,l:Math.random()*100,dur:1.4+Math.random()*2,delay:Math.random()*.8,g:['🎉','⭐','✨','🎊','💜'][Math.floor(Math.random()*5)],s:14+Math.random()*16})),[]);
  useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);
  return <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999}}>{ps.map(p=><span key={p.id} className="conf" style={{left:`${p.l}%`,fontSize:`${p.s}px`,animationDuration:`${p.dur}s`,animationDelay:`${p.delay}s`}}>{p.g}</span>)}</div>;
}

/* ── Toast ── */
function Toast({msg,type,onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]);
  return <div className={`toast fade-up ${type==='celebrate'?'toast-c':''}`}>{msg}</div>;
}

/* ── Task Form (bottom sheet) ── */
function TaskForm({task,projects,onSave,onClose}){
  const isEdit=!!task;
  const [f,setF]=useState(()=>task?{...task}:{title:'',description:'',project:'כללי',urgency:'low',isToday:false,duration:null,stage:'todo'});
  const [autoU,setAutoU]=useState(!isEdit);
  const ref=useRef();
  useEffect(()=>{setTimeout(()=>ref.current?.focus(),120);},[]);

  const onTitle=v=>setF(p=>{const n={...p,title:v};if(autoU)n.urgency=iUrg(v,p.description);if(!isEdit&&!p.duration)n.duration=iDur(v,p.description);return n;});
  const addProj=()=>{const p=window.prompt('שם הפרויקט:');if(p?.trim()){onSave._addProj?.(p.trim());setF(x=>({...x,project:p.trim()}));}};
  const handleProj=e=>{if(e.target.value==='__new__')addProj();else setF(x=>({...x,project:e.target.value}));};
  const submit=e=>{e.preventDefault();if(!f.title.trim())return;onSave(f);};

  const urgOpts=[{k:'urgent',l:'🔴 דחוף',c:'u-u'},{k:'medium',l:'🟠 בינוני',c:'u-m'},{k:'low',l:'🟢 רגיל',c:'u-l'}];
  const durOpts=[{k:null,l:'לא ידוע'},{k:'short',l:"⚡ קצר"},{k:'long',l:"⏰ ממושך"}];
  const stOpts=[{v:'todo',l:'📋 לביצוע'},{v:'inprogress',l:'⚡ בתהליך'},{v:'done',l:'✅ הושלם'}];

  return (
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box pop-in" onClick={e=>e.stopPropagation()}>
        {/* Handle */}
        <div style={{display:'flex',justifyContent:'center',padding:'12px 0 0'}}>
          <div style={{width:40,height:4,background:'#e2e8f0',borderRadius:2}}></div>
        </div>

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px 10px',borderBottom:'1px solid #f1f5f9'}}>
          <span style={{color:'#1e293b',fontWeight:800,fontSize:18}}>{isEdit?'✏️ עריכת משימה':'✦ משימה חדשה'}</span>
          <button onClick={onClose} style={{background:'#f1f5f9',border:'none',borderRadius:10,width:34,height:34,fontSize:20,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#64748b'}}>×</button>
        </div>

        <form onSubmit={submit} style={{padding:'14px 20px 32px',display:'flex',flexDirection:'column',gap:12}}>
          <input ref={ref} type="text" required placeholder="שם המשימה *" value={f.title} onChange={e=>onTitle(e.target.value)} className="inp"/>
          <textarea placeholder="תיאור (אופציונלי)" rows={2} value={f.description||''} onChange={e=>setF(p=>({...p,description:e.target.value}))} className="inp" style={{fontSize:14}}/>

          <div style={{position:'relative'}}>
            <select value={f.project} onChange={handleProj} className="inp" style={{paddingLeft:32,fontSize:14}}>
              {projects.map(p=><option key={p} value={p}>{p}</option>)}
              <option value="__new__">＋ פרויקט חדש</option>
            </select>
            <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:11}}>▾</span>
          </div>

          <div>
            <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>דחיפות</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              {urgOpts.map(({k,l,c})=>(
                <button key={k} type="button" className={`ub ${c} ${f.urgency===k?'on':''}`}
                  onClick={()=>{setF(p=>({...p,urgency:k}));setAutoU(false);}}>
                  {l}
                </button>
              ))}
            </div>
            {autoU&&f.title&&<p style={{fontSize:12,color:'#6366f1',marginTop:5,fontWeight:600}}>✨ זוהה אוטומטית</p>}
          </div>

          <div>
            <div style={{fontSize:12,fontWeight:700,color:'#94a3b8',marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>משך זמן</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              {durOpts.map(({k,l})=>(
                <button key={String(k)} type="button" className={`db ${f.duration===k?'on':''}`} onClick={()=>setF(p=>({...p,duration:k}))}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{display:'flex',gap:8}}>
            <button type="button" onClick={()=>setF(p=>({...p,isToday:!p.isToday}))}
              style={{flex:1,minHeight:48,borderRadius:14,fontSize:14,fontWeight:700,border:'2px solid',cursor:'pointer',transition:'all .14s',
                      background:f.isToday?'#fef9c3':'#f8fafc',borderColor:f.isToday?'#fbbf24':'#e2e8f0',color:f.isToday?'#92400e':'#94a3b8'}}>
              ⭐ {f.isToday?'מסומן להיום':'הוסף להיום'}
            </button>
            <div style={{position:'relative',flex:1}}>
              <select value={f.stage||'todo'} onChange={e=>setF(p=>({...p,stage:e.target.value}))} className="inp" style={{paddingLeft:28,fontSize:13,minHeight:48}}>
                {stOpts.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
              <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
            </div>
          </div>

          <button type="submit" style={{minHeight:54,borderRadius:16,background:'linear-gradient(135deg,#6366f1,#7c3aed)',color:'#fff',fontWeight:800,fontSize:16,border:'none',cursor:'pointer',boxShadow:'0 3px 12px rgba(99,102,241,.35)',marginTop:4}}>
            {isEdit?'שמור שינויים':'הוסף משימה ＋'}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ── TaskCard ── */
function TaskCard({task,onToggle,onEdit,onDelete,onDragStart,onDragOver,onDrop,isDragging}){
  const isDone=task.stage==='done';
  const lp=useRef(null);
  const [press,setPress]=useState(false);
  const startLP=()=>{setPress(true);lp.current=setTimeout(()=>{onDelete(task.id);setPress(false);},800);};
  const stopLP=()=>{clearTimeout(lp.current);setPress(false);};
  const sp=e=>{e.stopPropagation();stopLP();};

  const urg=task.urgency||'low';
  const chkC=isDone?'chk-done':urg==='urgent'?'chk-u':urg==='medium'?'chk-m':'chk-l';
  const bdgC=urg==='urgent'?'bu':urg==='medium'?'bm':'bl';
  const urgL=urg==='urgent'?'דחוף':urg==='medium'?'בינוני':'רגיל';
  const urgE=urg==='urgent'?'🔴':urg==='medium'?'🟠':'🟢';

  const cls=['card enter',`${urg[0]}`,isDone?'dn':'',task.isToday&&!isDone?'td':'',isDragging?'dr':''].filter(Boolean).join(' ');

  return (
    <div draggable
      onDragStart={()=>onDragStart(task.id)} onDragOver={e=>{e.preventDefault();onDragOver(task.id);}} onDrop={e=>{e.preventDefault();onDrop(task.id);}}
      onMouseDown={startLP} onMouseUp={stopLP} onMouseLeave={stopLP}
      onTouchStart={startLP} onTouchEnd={stopLP} onTouchMove={stopLP}
      className={cls} style={{padding:'14px 14px 12px'}}>

      <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
        <button onMouseDown={sp} onTouchStart={sp} onClick={e=>{sp(e);onToggle(task.id);}}
          className={`chk ${chkC}`} style={{marginTop:1,border:'none',padding:0,background:'transparent',flexShrink:0}}>
          {isDone&&<svg width="12" height="10" viewBox="0 0 12 10" fill="none"><path d="M1 5L4.5 8.5L11 1" stroke="white" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </button>

        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:6}}>
            <p style={{fontSize:15,fontWeight:600,lineHeight:1.4,flex:1,color:isDone?'#94a3b8':'#1e293b',textDecoration:isDone?'line-through':'none',wordBreak:'break-word'}}>
              {task.isToday&&!isDone&&<span style={{color:'#f59e0b',marginLeft:5,fontSize:14}}>⭐</span>}
              {task.title}
            </p>
            <div style={{display:'flex',gap:1,flexShrink:0}}>
              <button onMouseDown={sp} onTouchStart={sp} onClick={e=>{sp(e);onEdit(task);}}
                style={{color:'#cbd5e1',fontSize:14,padding:'4px 6px',borderRadius:8,cursor:'pointer',background:'none',border:'none',minWidth:32,minHeight:32,display:'flex',alignItems:'center',justifyContent:'center',transition:'color .12s'}}
                onMouseEnter={e=>e.currentTarget.style.color='#6366f1'} onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>✏️</button>
              <button onMouseDown={sp} onTouchStart={sp} onClick={e=>{sp(e);onDelete(task.id);}}
                style={{color:'#cbd5e1',fontSize:14,padding:'4px 6px',borderRadius:8,cursor:'pointer',background:'none',border:'none',minWidth:32,minHeight:32,display:'flex',alignItems:'center',justifyContent:'center',transition:'color .12s'}}
                onMouseEnter={e=>e.currentTarget.style.color='#ef4444'} onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>🗑</button>
            </div>
          </div>

          {task.description&&<p className="lc2" style={{fontSize:13,color:'#94a3b8',marginTop:3,lineHeight:1.5}}>{task.description}</p>}

          <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:9}}>
            <span className={`b ${bdgC}`}>{urgE} {urgL}</span>
            {task.project&&task.project!=='כללי'&&<span className="b bp">📁 {task.project}</span>}
            {task.duration==='long'&&<span className="b blg">⏰ ממושך</span>}
            {task.duration==='short'&&<span className="b bsh">⚡ קצר</span>}
            {task.isToday&&!isDone&&<span className="b bty">⭐ להיום</span>}
          </div>

          {task.duration==='long'&&!isDone&&(
            <div className="cal">
              <span style={{fontSize:15}}>📅</span>
              <span style={{fontSize:12,color:'#2563eb',flex:1,fontWeight:600}}>כדאי לשריין זמן ביומן</span>
              <button onMouseDown={sp} onTouchStart={sp}
                onClick={e=>{sp(e);window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(task.title)}&details=${encodeURIComponent(task.description||'')}`, '_blank');}}
                style={{fontSize:12,fontWeight:700,color:'#fff',background:'#3b82f6',border:'none',borderRadius:10,padding:'6px 12px',cursor:'pointer',minHeight:34}}>
                ליומן
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Kanban ── */
function Kanban({tasks,onEdit,onDelete,onStage}){
  const [dragId,setDragId]=useState(null);
  const [overS,setOverS]=useState(null);
  const by=useMemo(()=>{const g={todo:[],inprogress:[],done:[]};tasks.forEach(t=>(g[t.stage]||g.todo).push(t));return g;},[tasks]);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      {Object.entries(KCols).map(([s,c])=>(
        <div key={s} className={`kcol ${overS===s?'kd':''}`}
          onDragOver={e=>{e.preventDefault();setOverS(s);}} onDragLeave={()=>setOverS(null)}
          onDrop={e=>{e.preventDefault();if(dragId)onStage(dragId,s);setDragId(null);setOverS(null);}}>
          <div style={{background:c.h,padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between',borderBottom:'1px solid #f1f5f9'}}>
            <span style={{fontWeight:700,fontSize:14,color:c.ht}}>{c.i} {c.l}</span>
            <span style={{background:'rgba(0,0,0,.08)',borderRadius:20,fontSize:12,fontWeight:700,padding:'1px 8px'}}>{by[s].length}</span>
          </div>
          <div style={{padding:10,display:'flex',flexDirection:'column',gap:7}}>
            {by[s].map(t=>{
              const urg=t.urgency||'low';
              return (
                <div key={t.id} draggable onDragStart={()=>setDragId(t.id)} onDragEnd={()=>{setDragId(null);setOverS(null);}}
                  className="kcard" style={{opacity:dragId===t.id?.35:1}}>
                  <div style={{display:'flex',gap:4,justifyContent:'space-between'}}>
                    <p style={{fontSize:13,fontWeight:600,color:s==='done'?'#94a3b8':'#1e293b',textDecoration:s==='done'?'line-through':'none',flex:1,lineHeight:1.4}}>
                      {t.isToday&&<span style={{color:'#f59e0b',marginLeft:3}}>⭐</span>}
                      {t.title}
                    </p>
                    <div style={{display:'flex',gap:1}}>
                      <button onClick={()=>onEdit(t)} style={{fontSize:12,color:'#cbd5e1',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}} onMouseEnter={e=>e.currentTarget.style.color='#6366f1'} onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>✏️</button>
                      <button onClick={()=>onDelete(t.id)} style={{fontSize:12,color:'#cbd5e1',background:'none',border:'none',cursor:'pointer',padding:'2px 4px'}} onMouseEnter={e=>e.currentTarget.style.color='#ef4444'} onMouseLeave={e=>e.currentTarget.style.color='#cbd5e1'}>🗑</button>
                    </div>
                  </div>
                  <div style={{display:'flex',gap:4,marginTop:6,flexWrap:'wrap'}}>
                    <span className={`b ${urg==='urgent'?'bu':urg==='medium'?'bm':'bl'}`} style={{fontSize:11}}>{urg==='urgent'?'🔴':urg==='medium'?'🟠':'🟢'}</span>
                    {t.project&&t.project!=='כללי'&&<span className="b bp" style={{fontSize:11}}>📁 {t.project}</span>}
                  </div>
                </div>
              );
            })}
            {by[s].length===0&&<p style={{textAlign:'center',color:'#cbd5e1',fontSize:13,padding:'16px 0'}}>גרור לכאן</p>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── App ── */
function App(){
  const [tasks,setTasks]=useState([]);
  const [projects,setProjects]=useState(PROJECTS);
  const [streak,setStreak]=useState({count:0,lastDate:today()});
  const [loaded,setLoaded]=useState(false);
  const [view,setView]=useState('list');
  const [search,setSearch]=useState('');
  const [fProj,setFProj]=useState('');
  const [fUrg,setFUrg]=useState('');
  const [showSearch,setShowSearch]=useState(false);
  const [showDone,setShowDone]=useState(false);
  const [showForm,setShowForm]=useState(false);
  const [editTask,setEditTask]=useState(null);
  const [toast,setToast]=useState(null);
  const [confetti,setConfetti]=useState(false);
  const [saved,setSaved]=useState(false);
  const [dragId,setDragId]=useState(null);
  const dragRef=useRef(null);
  const prevDone=useRef(0);

  useEffect(()=>{
    const d=load();
    if(d){setTasks(d.tasks||[]);setProjects(d.projects||PROJECTS);setStreak(d.streak||{count:0,lastDate:today()});prevDone.current=(d.tasks||[]).filter(t=>t.stage==='done'&&t.completedAt?.startsWith(today())).length;}
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(!loaded)return;
    localStorage.setItem(STORE,JSON.stringify({tasks,projects,streak}));
    setSaved(true);const t=setTimeout(()=>setSaved(false),1200);return()=>clearTimeout(t);
  },[tasks,projects,streak,loaded]);

  const doneToday=useMemo(()=>tasks.filter(t=>t.stage==='done'&&t.completedAt?.startsWith(today())).length,[tasks]);

  useEffect(()=>{
    if(!loaded)return;
    if(doneToday>prevDone.current&&MILES.includes(doneToday)){setConfetti(true);push(CHEERS[Math.floor(Math.random()*CHEERS.length)],'celebrate');}
    prevDone.current=doneToday;
  },[doneToday,loaded]);

  const push=(msg,type='info')=>setToast({msg,type});
  const addProj=useCallback(n=>{if(n)setProjects(p=>[...p,n]);},[]);

  const handleSave=useCallback(form=>{
    if(form.id){setTasks(p=>p.map(t=>t.id===form.id?{...t,...form}:t));push('✏️ עודכנה');}
    else{setTasks(p=>[{id:uid(),title:form.title.trim(),description:form.description||'',project:form.project||'כללי',urgency:form.urgency||'low',isToday:form.isToday||false,duration:form.duration||null,stage:form.stage||'todo',createdAt:new Date().toISOString(),completedAt:null},...p]);push('✅ נוספה!');}
    setShowForm(false);setEditTask(null);
  },[]);
  handleSave._addProj=addProj;

  const delTask=useCallback(id=>{if(!window.confirm('למחוק?'))return;setTasks(p=>p.filter(t=>t.id!==id));push('🗑 נמחקה');},[]);
  const toggle=useCallback(id=>{setTasks(p=>p.map(t=>t.id!==id?t:{...t,stage:t.stage!=='done'?'done':'todo',completedAt:t.stage!=='done'?new Date().toISOString():null}));},[]);
  const stageChange=useCallback((id,s)=>{setTasks(p=>p.map(t=>t.id!==id?t:{...t,stage:s,completedAt:s==='done'&&t.stage!=='done'?new Date().toISOString():(s!=='done'?null:t.completedAt)}));},[]);

  const dStart=useCallback(id=>{dragRef.current=id;setDragId(id);},[]);
  const dDrop=useCallback(tid=>{const fid=dragRef.current;if(!fid||fid===tid){setDragId(null);return;}setTasks(p=>{const a=[...p],fi=a.findIndex(t=>t.id===fid),ti=a.findIndex(t=>t.id===tid);if(fi<0||ti<0)return p;const[m]=a.splice(fi,1);a.splice(ti,0,m);return a;});setDragId(null);},[]);

  const filtered=useMemo(()=>tasks.filter(t=>{
    const q=search.toLowerCase();
    if(q&&!t.title.toLowerCase().includes(q)&&!(t.description||'').toLowerCase().includes(q))return false;
    if(fProj&&t.project!==fProj)return false;
    if(fUrg&&t.urgency!==fUrg)return false;
    return true;
  }),[tasks,search,fProj,fUrg]);

  const active=filtered.filter(t=>t.stage!=='done');
  const done=filtered.filter(t=>t.stage==='done');
  const todayT=active.filter(t=>t.isToday);
  const urgT=active.filter(t=>t.urgency==='urgent'&&!t.isToday);
  const otherT=active.filter(t=>t.urgency!=='urgent'&&!t.isToday);
  const usedP=useMemo(()=>[...new Set(tasks.map(t=>t.project).filter(Boolean))]  ,[tasks]);

  const cp=t=>({task:t,onToggle:toggle,onEdit:setEditTask,onDelete:delTask,onDragStart:dStart,onDragOver:()=>{},onDrop:dDrop,isDragging:dragId===t.id});
  const openForm=()=>{setEditTask(null);setShowForm(true);};

  return (
    <div style={{minHeight:'100vh',paddingBottom:90}}>

      {/* ── Header ── */}
      <header className="hdr">
        <div style={{maxWidth:600,margin:'0 auto',padding:'10px 14px'}}>

          {/* Row 1: title + controls */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
            <div style={{flex:1}}>
              <div style={{fontSize:18,fontWeight:800,color:'#1e293b'}}>📋 מנהל המשימות</div>
              <div style={{fontSize:11,color:'#94a3b8',marginTop:1,fontWeight:500}}>
                <span style={{color:'#6366f1',fontWeight:700}}>{doneToday}</span> הושלמו היום
                {streak.count>1&&<span style={{color:'#f97316',fontWeight:700,marginRight:6}}> · 🔥{streak.count} ימים</span>}
              </div>
            </div>

            <div style={{display:'flex',gap:7,alignItems:'center'}}>
              <button onClick={()=>setShowSearch(v=>!v)} className={`btn-ico ${showSearch?'on':''}`}>🔍</button>
              <button onClick={()=>setView(v=>v==='list'?'kanban':'list')} className={`btn-view ${view==='kanban'?'on':''}`}>
                {view==='kanban'?'📋':'📊'}
              </button>
              <button onClick={openForm} className="btn-add">＋ משימה</button>
            </div>
          </div>

          {/* Row 2: search (collapsible) */}
          <div className={`search-bar ${showSearch?'open':'closed'}`} style={{paddingTop: showSearch?10:0}}>
            <div style={{display:'flex',gap:8}}>
              <input type="search" placeholder="חיפוש..." value={search} onChange={e=>setSearch(e.target.value)}
                className="inp" style={{flex:1,fontSize:14,minHeight:42}}/>
              <div style={{position:'relative'}}>
                <select value={fProj} onChange={e=>setFProj(e.target.value)} className="inp" style={{minHeight:42,padding:'0 28px 0 10px',fontSize:12,maxWidth:110}}>
                  <option value="">📁 הכל</option>
                  {usedP.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
                <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
              </div>
              <div style={{position:'relative'}}>
                <select value={fUrg} onChange={e=>setFUrg(e.target.value)} className="inp" style={{minHeight:42,padding:'0 24px 0 10px',fontSize:13}}>
                  <option value="">🎯</option>
                  <option value="urgent">🔴</option>
                  <option value="medium">🟠</option>
                  <option value="low">🟢</option>
                </select>
                <span style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',color:'#94a3b8',pointerEvents:'none',fontSize:9}}>▾</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      {/* ── Content ── */}
      <div style={{maxWidth:600,margin:'0 auto',padding:'14px 14px 0'}}>
        {view==='kanban'?(
          <Kanban tasks={filtered} onEdit={setEditTask} onDelete={delTask} onStage={stageChange}/>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:18}}>

            {/* Today */}
            {todayT.length>0&&(
              <div className="today-wrap">
                <div className="today-hdr" style={{padding:'10px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:14,fontWeight:800,color:'#78350f'}}>⭐ להיום · {todayT.length}</span>
                  {todayT.length>3&&<span style={{fontSize:12,color:'#92400e',background:'rgba(251,191,36,.3)',borderRadius:20,padding:'3px 10px',fontWeight:700}}>💡 עד 3 משימות</span>}
                </div>
                <div style={{padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
                  {todayT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}
                </div>
              </div>
            )}

            {/* Urgent */}
            {urgT.length>0&&(
              <div>
                <div className="st"><span className="dot" style={{background:'#f87171'}}></span>דחוף · {urgT.length}</div>
                <div style={{display:'flex',flexDirection:'column',gap:8}}>{urgT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}</div>
              </div>
            )}

            {/* Others */}
            {otherT.length>0&&(
              <div>
                {(urgT.length>0||todayT.length>0)&&<div className="st"><span className="dot" style={{background:'#e2e8f0'}}></span>שאר המשימות · {otherT.length}</div>}
                <div style={{display:'flex',flexDirection:'column',gap:8}}>{otherT.map(t=><TaskCard key={t.id} {...cp(t)}/>)}</div>
              </div>
            )}

            {/* Empty */}
            {active.length===0&&(
              <div style={{textAlign:'center',padding:'60px 0'}}>
                {tasks.length===0?(
                  <><div style={{fontSize:56,marginBottom:12}}>🎯</div>
                  <p style={{fontSize:17,fontWeight:700,color:'#64748b',marginBottom:6}}>אין משימות עדיין</p>
                  <p style={{fontSize:14,color:'#94a3b8'}}>לחץ ＋ משימה להתחלה</p></>
                ):(
                  <><div style={{fontSize:40,marginBottom:10}}>🔍</div>
                  <p style={{fontSize:15,fontWeight:700,color:'#64748b'}}>לא נמצאו תוצאות</p></>
                )}
              </div>
            )}

            {/* Done */}
            {done.length>0&&(
              <div>
                <button onClick={()=>setShowDone(v=>!v)}
                  style={{display:'flex',alignItems:'center',gap:6,fontSize:12,fontWeight:700,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.06em',background:'none',border:'none',cursor:'pointer',marginBottom:8,padding:0}}>
                  <span style={{transition:'transform .18s',transform:showDone?'rotate(90deg)':'none',fontSize:9}}>▶</span>
                  ✅ הושלמו · {done.length}
                </button>
                {showDone&&<div style={{display:'flex',flexDirection:'column',gap:8,opacity:.58}}>{done.map(t=><TaskCard key={t.id} {...cp(t)}/>)}</div>}
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── FAB ── */}
      <button onClick={openForm} className="fab">＋ משימה חדשה</button>

      {/* ── Overlays ── */}
      {saved&&<div className="saved fade-up">✓ נשמר</div>}
      {(showForm||editTask)&&<TaskForm task={editTask} projects={projects} onSave={handleSave} onClose={()=>{setShowForm(false);setEditTask(null);}}/>}
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      {confetti&&<Confetti onDone={()=>setConfetti(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
